      # Normal 90F-plus hot uplift was protective in earlier fixed-origin runs, but the
      # 2026-06-07 post-holiday seasonal replay shows it overcorrecting long-lead
      # 90-97F peak hours. Keep the 110F-plus emergency layer below; disable this broad
      # normal-hot uplift until a lead-aware replacement is proven.
      enabled: false
      min_forecast_day: 2
      max_forecast_day: 16
      min_maxtemp_f: 90.0
      hours: [14, 15, 16, 17, 18, 19, 20]
      base_uplift_mwh: 0.0
      max_uplift_mwh: 3.0
      horizon_uplift_mwh:
        Days2to7: 2.25
        Days8to16: 2.25

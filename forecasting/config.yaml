# --- Project configuration ---

project:
  name: "V12.9 Weather-Realism Peak-Risk Hardening"
  timezone: "America/Los_Angeles"
  output_dir: "forecast_outputs"

sql:
  dsn_name: "Informatica LRS"
  # Historical hourly system load (MWh), day-wide rows with Hr1...Hr24 columns
  history_query: |
    SELECT *
    FROM [Informatica].[dbo].[METRIX_HRLY_SYSTEM_VW]
    ORDER BY YEAR, MONTH, DAY

output_sql:
  # Default persistence for high-churn outputs that are overwritten on each CSV run.
  # Use --no-save-sql for local dry runs that should not write to SQL Server.
  enabled: true
  dashboard_read_enabled: true
  dsn_name: "Forecast_DB"
  database: ""
  schema: "Forecasting"
  run_table: "LoadForecastRun"
  forecast_table: "LoadForecastOutput"
  backtest_table: "LoadForecastBacktest"
  weather_table: "LoadForecastWeather"
  forecast_weather_archive_table: "LoadForecastWeatherArchive"
  replay_tables:
    rolling_origin_replay_summary: "LoadForecastReplaySummary"
    rolling_origin_replay_results: "LoadForecastReplayResult"
    rolling_origin_replay_origin_coverage: "LoadForecastReplayOriginCoverage"
    rolling_origin_replay_scorecard: "LoadForecastReplayScorecard"
    rolling_origin_replay_weather_realism_scorecard: "LoadForecastReplayWeatherRealismScorecard"
    rolling_origin_replay_weather_input_error_by_lead: "LoadForecastReplayWeatherInputErrorByLead"
    rolling_origin_replay_weather_input_sensitivity_scorecard: "LoadForecastReplayWeatherInputSensitivityScorecard"
    rolling_origin_replay_weather_input_sensitivity_detail: "LoadForecastReplayWeatherInputSensitivityDetail"
    rolling_origin_replay_stage_metrics: "LoadForecastReplayStageMetric"
    rolling_origin_replay_origin_metrics_by_stage: "LoadForecastReplayOriginMetricByStage"
    rolling_origin_replay_scored_season_metrics_by_stage: "LoadForecastReplayScoredSeasonMetricByStage"
    rolling_origin_replay_origin_season_metrics_by_stage: "LoadForecastReplayOriginSeasonMetricByStage"
    rolling_origin_replay_horizon_metrics_by_stage: "LoadForecastReplayHorizonMetricByStage"
    rolling_origin_replay_peak_window_metrics_by_stage: "LoadForecastReplayPeakWindowMetricByStage"
    rolling_origin_replay_hot_peak_metrics_by_stage: "LoadForecastReplayHotPeakMetricByStage"
    rolling_origin_replay_shoulder_heat_metrics_by_stage: "LoadForecastReplayShoulderHeatMetricByStage"
    rolling_origin_replay_cloud_solar_midday_metrics_by_stage: "LoadForecastReplayCloudSolarMiddayMetricByStage"
    rolling_origin_replay_weekend_metrics_by_stage: "LoadForecastReplayWeekendMetricByStage"
    rolling_origin_replay_holiday_metrics_by_stage: "LoadForecastReplayHolidayMetricByStage"
    rolling_origin_replay_long_horizon_metrics_by_stage: "LoadForecastReplayLongHorizonMetricByStage"
    rolling_origin_replay_daily_peak_miss_by_stage: "LoadForecastReplayDailyPeakMissByStage"
    rolling_origin_replay_timing: "LoadForecastReplayTiming"
    production_readiness_scorecard: "LoadForecastProductionReadinessScorecard"
  chunksize: 10

five_min_load:
  enabled: true
  dsn_name: "PowerSupply"
  query: |
    SELECT
      StartPST,
      EndPST,
      TimeFrameName,
      Interval,
      Quantity,
      QualityName
    FROM PowerSupply.Measurements.Load_Native
    WHERE SourceTypeName = 'PI_AF'
      AND LocationName = 'RsvlCityGate'
      AND TimeFrameName = '5min'
      AND MeasurementTypeName = 'SystemLoad'
      AND StartPST >= DATEADD(day, -180, GETDATE())
    ORDER BY StartPST
  # Prior-hour 5-minute aggregates are leakage-safe for hourly forecasts.
  # Future hours carry the latest known intraday state with an age feature.
  max_carry_forward_hours: 24
  # Completed 5-minute hours are promoted into actual load history below. Future
  # 5-minute model feature carry-forward is disabled by default because fixed-origin
  # replay showed Day 1 degradation and exact future 5-minute values are not
  # operationally available.
  future_model_features_enabled: false
  # Promote completed 5-minute hours into the recent hourly load history so reruns
  # anchor the recursive forecast on the newest available system load.
  use_as_recent_hourly_load: true
  min_completed_intervals_per_hour: 10
  replace_overlap_hours: 0

local_weather:
  # Local station history is initially used for diagnostics. Enable temperature_calibration
  # explicitly for controlled A/B replay before promoting it to production.
  enabled: true
  dsn_name: "PowerSupply"
  query: |
    SELECT  'BERRY_ST' AS STATIONID,
            'Temperature' AS CONCEPTID,
            [PacificStandardTime] AS DT,
            [Value] AS READING
      FROM [PowerSupply].[Measurements].[Weather_Hourly]
      WHERE LocationName = 'Berry Sub'
      AND PacificStandardTime >= '2005-05-14'
    ORDER BY PacificStandardTime
  temperature_calibration:
    enabled: false
    blend: 1.0
    cap_f: 8.0
    max_abs_delta_f: 25.0
    min_count: 24
    # Real-time dynamic calibration to correct for transient cooling/warming events
    # like the Roseville Delta Breeze. Looks at the last 24 hours of actual weather station
    # readings vs Open-Meteo and applies a decaying correction factor to the future forecast.
    dynamic_enabled: true
    dynamic_window_hours: 24
    dynamic_cap_f: 6.0
    dynamic_blend: 0.80
    dynamic_decay_hours: 48.0

openmeteo:
  latitude: 38.7521
  longitude: -121.2880
  # Use UTC from API and convert to local timezone
  hourly_vars:
    - temperature_2m
    - relative_humidity_2m
    - cloud_cover
    - wind_speed_10m
    - precipitation
    - shortwave_radiation
    - is_day
  temperature_unit: "fahrenheit"
  wind_speed_unit: "mph"
  precipitation_unit: "inch"
  # Request timestamps in the project timezone so "historical_end=yesterday local" includes
  # the entire local day (00:00-23:00), rather than stopping at 16:00 local when using GMT.
  timezone: "America/Los_Angeles"
  # When the forecast API is queried after midnight GMT, the returned hourly series can begin at
  # 00:00 "today" GMT (which is 17:00 the prior day in America/Los_Angeles), leaving a visible gap
  # between the last historical load hour and the first forecast hour. Request a small amount of
  # "past" hourly data so the next local midnight is always included; the pipeline still filters
  # to DT > latest_hist_dt, so this does not change the forecast horizon.
  forecast_past_hours: 36
  historical_url: "https://archive-api.open-meteo.com/v1/archive"
  forecast_url: "https://api.open-meteo.com/v1/forecast"
  previous_runs_url: "https://previous-runs-api.open-meteo.com/v1/forecast"
  historical_start: "2020-01-01"     # training start date
  historical_end: null                # null => yesterday local
  forecast_days: 16
  cache_dir: "weather_cache"
  # TLS certificate verification for weather API calls. Keep true so responses are
  # authenticated. On Windows, ssl_use_os_truststore lets requests honor the machine
  # certificate store via truststore, which fixes managed/self-signed proxy chains
  # without disabling verification. For a custom corporate PEM bundle, set
  # ssl_ca_bundle or OPENMETEO_CA_BUNDLE. OPENMETEO_SSL_VERIFY=false remains an
  # emergency local-only bypass and should not be committed into normal config.
  ssl_verify: true
  ssl_use_os_truststore: true
  ssl_ca_bundle: null

btm:
  mode: "hardcoded"   # "hardcoded" | "sql" | "csv"
  tsv_path: ""        # not used when mode=hardcoded
  sql_table: "[Informatica].[dbo].[BTM_SOLAR_MONTHLY_INSTALLATIONS]"
  extend_future_months: 36
  current_nameplate_mw: 63.5
  max_observed_impact_mw: 23.0

training:
  train_start_date: "2020-01-01"
  backtest_days: 45
  seasonal_backtests: false
  rolling_origin_replay:
    # Opt-in production-horizon replay. Use --rolling-origin-replay with --save-csv to export outputs.
    # Correction lookups/profile for each origin are learned from the preceding calibration window only.
    enabled: false
    parallel:
      enabled: true
      processes: 4  # null to default to cpu_count() // 2
    horizon_days: 16
    calibration_days: 45
    origin_selection: "fixed" # Fixed set keeps tuning passes apples-to-apples; remove fixed_origins to rebalance.
    origin_step_days: 28
    max_origins: 20
    fixed_origins:
      - "2024-10-13"
      - "2024-11-09 23:00:00-08:00"
      - "2025-03-30"
      - "2025-04-27"
      - "2025-05-25"
      - "2025-06-22"
      - "2025-07-20"
      - "2025-08-17"
      - "2025-09-14"
      - "2025-10-12"
      - "2025-11-08 23:00:00-08:00"
      - "2025-12-06 23:00:00-08:00"
      - "2026-01-03 23:00:00-08:00"
      - "2026-01-31 23:00:00-08:00"
      - "2026-02-28 23:00:00-08:00"
      - "2026-03-29"
      - "2026-04-26"
      - "2026-05-24"
      # June 12-style hot-ramp validation: origins that score the 2026-06-12
      # 99F load ramp inside the production horizon once recent actuals exist.
      - "2026-05-28"
      - "2026-05-29"
    origins_per_season: 4
    scorecard_min_origins_per_season: 3
    min_train_days: 365
    # Speed controls for rolling replay only. Prophet is benchmark-only in production,
    # and the peak-risk guard now has tree-disagreement fallback signals, so replay
    # does not need to fit origin Prophet for the production correction chain.
    skip_prophet: true
    skip_calibration_prophet: true
    skip_catboost: false
    log_timing: true
    allow_concurrent: false
    weather_realism:
      # Previous Runs fixed-lead weather covers operational weather error for Days 1-7.
      enabled: true
      max_previous_days: 7

hardware:
  # V12.8 keeps V12.3/V12.4 max performance mode. Use all visible CPU cores and XGBoost GPU when available.
  # CPU threads: -1 means all visible logical cores. Override with --cpu-threads N.
  performance_mode: "max"
  cpu_threads: -1
  max_workers: -1
  set_thread_env: true
  overwrite_thread_env: false
  parallel_tree_training: true
  force_parallel_cpu_training: false

  # XGBoost GPU training is enabled by default. If CUDA/XGBoost rejects GPU training,
  # the script automatically retries CPU.
  use_gpu: true
  xgb_gpu_api: "auto"       # "auto" | "cuda" | "gpu_hist" | "legacy"
  fallback_to_cpu: true

  # LightGBM GPU is opt-in because many Windows wheels are CPU-only or OpenCL-dependent.
  # Leave false unless your installed LightGBM build is known to support GPU.
  use_lgb_gpu: false

model:
  ensemble_weights:
    # 2026-06-12 holdout grid, constrained to avoid worsening actual-peak
    # underforecast versus the prior XGB/LGB blend.
    xgb: 0.10
    lgb: 0.55
    prophet: 0.00     # benchmark-only unless blend_into_production=true
    catboost: 0.35

  early_stopping:
    # Improves generalization by stopping when recent validation MAE stops improving.
    enabled: true
    validation_days: 45
    min_train_rows: 2000
    rounds: 75
    metric: "mae"

  xgb:
    n_estimators: 1400
    max_depth: 8
    learning_rate: 0.025
    min_child_weight: 3
    subsample: 0.85
    colsample_bytree: 0.85
    reg_lambda: 2.0
    reg_alpha: 0.05
    gamma: 0.0
    tree_method: "hist"     # V12.2 GPU default: modern XGBoost uses hist + device=cuda
    device: "cuda"          # "cuda" or "cpu"; CPU fallback is controlled by hardware.fallback_to_cpu
    gpu_api: "auto"         # try modern CUDA first, then legacy gpu_hist, then CPU
    random_state: 42
    n_jobs: -1

  sample_weight:
    peak_q90: 0.90
    peak_q95: 0.95
    peak_q90_weight: 1.8
    peak_q95_weight: 3.0
    hot_day_min_f: 90.0
    hot_peak_hours: [16, 17, 18, 19, 20]
    hot_peak_weight: 1.7
    # Align train weighting with the production scorecard gates. The previous hot
    # emphasis only used IsLikelySystemPeakHour, which excludes weekends/holidays;
    # the scorecard hot gate is HE16-20 whenever daily max is >= 90F.
    non_business_hot_peak_weight: 1.25
    peak_window_hours: [14, 15, 16, 17, 18]
    peak_window_min_maxtemp_f: 75.0
    peak_window_weight: 1.12
    recency_end_weight: 1.35
    max_weight: 8.0

  lgb:
    # Keep CPU by default. Set hardware.use_lgb_gpu=true only if your LightGBM build supports GPU.
    use_gpu: false
    device_type: "gpu"
    n_estimators: 1200
    learning_rate: 0.025
    num_leaves: 96
    min_child_samples: 25
    subsample: 0.85
    colsample_bytree: 0.85
    reg_lambda: 2.0
    reg_alpha: 0.05
    random_state: 42
    n_jobs: -1

  catboost:
    # V12.9: CatBoost is blended into production at a constrained weight after
    # the latest holdout grid showed lower raw MAE without increasing the actual
    # peak miss versus the prior XGB/LGB blend.
    enabled: true
    blend_into_production: true
    iterations: 1400
    depth: 8
    learning_rate: 0.025
    l2_leaf_reg: 4.0
    loss_function: "RMSE"
    random_seed: 42
    task_type: "CPU"        # GPU first when hardware.use_gpu=true; CPU fallback is automatic
    devices: "0"
    thread_count: -1

  prophet:
    enabled: true
    blend_into_production: false   # Keep Prophet separate from production forecast by default.
    growth: "linear"
    seasonality_mode: "multiplicative"
    yearly_seasonality: true
    weekly_seasonality: true
    daily_seasonality: true
    changepoint_prior_scale: 0.08
    seasonality_prior_scale: 6.0
    holidays_prior_scale: 5.0
    interval_width: 0.80
    add_roseville_holidays: true
    holiday_years_forward: 3
    add_monthly_seasonality: true
    monthly_period_days: 30.5
    monthly_fourier_order: 5
    add_annual_peak_seasonality: true
    annual_peak_period_days: 365.25
    annual_peak_fourier_order: 12
    standardize_regressors: true
    regressor_prior_scale: 0.25
    min_train_rows: 1440
    # CmdStan can hang or run for many minutes when optimizing the full multi-year
    # hourly frame with the full regressor set. Keep Prophet as a recent-history
    # benchmark model; production Raw_Forecast_MWH does not blend Prophet by default.
    max_train_rows: 13140   # 18 months of hourly rows
    fit_algorithm: "LBFGS"
    fit_iter: 10000

forecast:
  horizons:
    next_day_hours: 24
    next_week_days: 7
    full_days: 16     # run through 16 calendar days
  require_full_window: false

quality:
  valid_temp_min_f: 10.0
  valid_temp_max_f: 120.0
  max_interpolation_gap_hours: 3
  # Timestamp alignment knob (ported from v11.6 WEATHER_TIMESTAMP_SHIFT_HOURS).
  # Use +1 or -1 only if your weather timestamps are proven to be offset relative to
  # the load timestamps (hour-beginning vs hour-ending conventions).
  weather_timestamp_shift_hours: 0

bands:
  # V12.8: conditional residual bands are primary, with extra widening for hours 14-16 and solar-loss risk.
  # Exported forecast outputs name the central 80% residual band P10/P50/P90.
  default_percent_band: 0.055
  band_floor_mwh: 4.0
  band_scale: 0.55
  residual_based: true
  hot_bucket_band_floor:
    # The 6-origin hot replay showed overnight interval undercoverage after the point forecast
    # guard fixes. Keep this scoped to hot overnight rows so midday/peak intervals are unchanged.
    enabled: true
    rules:
      - name: hot_95_to_100_overnight_min_band
        min_daily_max_temp_f: 95.0
        max_daily_max_temp_f: 100.0
        hour_groups: ["Overnight"]
        min_band_mwh: 5.5
      - name: hot_100_plus_overnight_min_band
        min_daily_max_temp_f: 100.0
        hour_groups: ["Overnight"]
        min_band_mwh: 7.5
      - name: hot_100_plus_early_overnight_min_band
        min_daily_max_temp_f: 100.0
        hours: [0, 1]
        min_band_mwh: 13.0
      - name: hot_100_plus_late_evening_min_band
        min_daily_max_temp_f: 100.0
        hour_groups: ["LateEvening"]
        min_band_mwh: 15.0
  weather_input_risk:
    # Previous-run weather replay showed forecast-weather inputs can roughly double operational
    # error on days 1-7, especially cloudy solar-loss and hot-peak regimes. This widens future
    # P10/P90 bands only; it does not move the P50 point forecast.
    enabled: true
    max_day: 16
    # Calibrated from rolling_origin_replay_weather_input_sensitivity_scorecard.
    # Day 1 and days 4-7 showed larger operational weather-error damage than days 2-3.
    day1_multiplier: 1.45
    days2to3_multiplier: 1.60
    days4to7_multiplier: 3.00
    days8to16_multiplier: 3.50
    cloudy_solar_multiplier: 1.45
    hot_peak_multiplier: 1.60
    shoulder_heat_multiplier: 1.45
    high_temp_min_maxtemp_f: 95.0
    high_temp_multiplier: 2.20
    cap_multiplier: 6.00
  weather_scenarios:
    enabled: true
    cap_scenario_deltas: true
    delta_caps:
      default_mwh: 18.0
      cloud_solar_mwh: 14.0
      hot_peak_mwh: 22.0
      days8to16_mwh: 16.0
      hot_peak_min_maxtemp_f: 90.0
      cloud_solar_min_loss_mw: 1.25
    scenarios:
      - name: warmer
        temperature_delta_f: 3.0
      - name: hot_stress_5f
        temperature_delta_f: 5.0
      - name: cooler
        temperature_delta_f: -3.0
      - name: cloudier_solar_loss
        cloud_cover_delta_norm: 0.30
        ghi_multiplier: 0.65
      - name: severe_cloud_solar_loss
        cloud_cover_delta_norm: 0.45
        ghi_multiplier: 0.50
      - name: clearer_high_solar
        cloud_cover_delta_norm: -0.30
        ghi_multiplier: 1.15
  conformal_weather:
    enabled: true
    quantile: 0.80
    safety_multiplier: 1.0
    scenario_spread_multiplier: 1.0
    # The guarded replay had high Day 1 / normal-hour coverage after conformal widening.
    # Reduce only those lower-risk conformal add-ons; hot peak, peak-window, cloud/solar,
    # shoulder heat, and long-horizon caution hours keep the full safety factor.
    horizon_safety_multipliers:
      Day1: 0.85
    normal_only_safety_multiplier: 0.92
    # Walk-forward replay showed conformal narrowing under-covered hot peaks and shoulder heat.
    # Use conformal and weather scenarios as additional guards, not as a replacement for the
    # tuned weather-risk band.
    allow_narrowing: false
    min_group_rows: 20
    min_global_rows: 50
    min_fraction_of_multiplier_band: 0.0

# Pure exclusion of anomalous load intervals (DER dispatch, telemetry gaps, etc.).
# The listed date + hour-ending (HE) ranges are DROPPED - not repaired - from residual
# learning, the calibration lookups, the recent-residual profile, and the replay
# scorecards, so they cannot bias corrections or register as spurious peak misses.
# HE h maps to the hour-beginning Hour value h-1 (HE 17 == the 16:00-17:00 interval,
# Hour 16). Omit he_start/he_end to exclude a whole day.
anomaly_exclusions:
  enabled: true
  events:
    - name: "2026-07-15 DER dispatch"
      date: "2026-07-15"
      he_start: 17
      he_end: 19

calibration:
  seasonal_enabled: true
  stage_selector:
    # Full seasonal replay showed raw Day 1 and final peak-window selection leaving accuracy
    # on the table. Select the most robust stage by operational horizon and peak window.
    enabled: true
    day1_stage: targeted_meta
    days2to3_stage: peak_risk
    days4to7_stage: recent_corrected
    non_horizon_apply_bias_uplift: false
    non_horizon_apply_hot_uplift: false
    suppress_bias_uplift_for_stage_overrides: true
    suppress_hot_uplift_for_stage_overrides: true
    day1_peak_risk_weight: 0.40
    hot_peak_min_maxtemp_f: 90.0
    hot_peak_final_stack_override: false
    peak_window_stage_override:
      # 2026-06-07 post-holiday replay: the broad HE14-18 override no longer cleared the
      # peak-window gate and slightly worsened the simpler horizon policy. Leave the
      # block available for A/B tests, but keep the production selector horizon-driven.
      enabled: false
      hours: [14, 15, 16, 17, 18]
      min_forecast_day: 1
      max_forecast_day: 16
      min_maxtemp_f: -999.0
      stage: recent_corrected
      exclude_hot_peak: true
      suppress_bias_uplift: true
      suppress_hot_uplift: true
    cloud_solar_raw_override:
      # 2026-06-07 post-holiday replay showed recent-corrected beating the raw override
      # on cloud/solar midday (about 4.91 vs 5.60 MAE). Disable the broad raw override
      # unless a future replay proves the cloud slice regressed.
      enabled: false
      hours: [10, 11, 12, 13]
      min_cloud_cover_norm: 0.60
      min_solar_loss_mw: 1.25
      stage: raw
      suppress_bias_uplift: true
      suppress_hot_uplift: true
    conditional_stage_overrides:
      # Latest forecast-output scorecard showed summer high-temperature rows were
      # often better before the post-raw correction stack. Keep this narrow and
      # diagnostic so it can be A/B tested in rolling replay.
      - name: summer_high_temp_raw_override
        enabled: true
        seasons: [Summer]
        # Full replay: raw helped core midday but hurt HE16-20 and overnight.
        # Keep it outside the HE14-18 peak-window scorecard.
        hours: [9, 10, 11, 12, 13]
        min_daily_max_temp_bucket: 6
        min_forecast_day: 1
        max_forecast_day: 16
        stage: raw
    long_horizon_peak_hot_month_correction:
      # 2026-06-08 replay isolated the remaining scorecard failures to day-8..16
      # HE14-18 and hot HE16-20 rows. A single scalar uplift was not valid: May/Sep
      # were overforecast while July was underforecast. Use signed, bounded month
      # corrections only on long-horizon peak/hot rows. Hot rows override the peak
      # offset on HE16-18 overlap so the two tuned offsets do not stack.
      enabled: true
      min_forecast_day: 8
      max_forecast_day: 16
      peak_hours: [14, 15, 16, 17, 18]
      hot_hours: [16, 17, 18, 19, 20]
      hot_min_maxtemp_f: 90.0
      # The May hot-month downshift is calibrated for the 93F-plus long-horizon
      # overforecast cluster. Do not apply it to 90-92F shoulder-heat peaks,
      # where the weather-robustness hedge can otherwise fight a -12 MWh cap.
      hot_min_maxtemp_f_by_month:
        "5": 93.0
      peak_cap_mwh: 8.0
      hot_cap_mwh: 12.0
      peak_exclude_holidays: true
      hot_exclude_holidays: true
      peak_month_offsets_mwh:
        "1": 0.0
        "2": 0.80
        "3": 0.0
        "4": -1.54
        "5": 0.0
        "6": -2.12
        "7": 7.76
        "8": -1.39
        "9": -6.44
        "10": 2.21
        "11": 5.75
        "12": -1.16
      hot_month_offsets_mwh:
        "5": -14.76
        "6": 0.0
        "7": 9.07
        "8": 0.11
        "9": 0.0
    focused_scorecard_guard:
      # 2026-06-14 full rolling-origin counterfactual: retune the overactive June
      # clear-hot, May hot downshift, July holiday, and August day-4..7 rules, then
      # add narrow long-lead hot/peak guards for repeated same-shape misses.
      # Full replay counterfactual: hot 6.39 -> 5.78, peak 5.58 -> 5.39,
      # overall 3.94 -> 3.89.
      enabled: true
      total_cap_mwh: 30.0
      rules:
        # 2026-07-07 Last-45 counterfactual: these no-horizon shape guards use
        # only production-visible weather/hour fields. They are allowed on recent
        # actual backtest rows without re-enabling derived fake forecast horizons.
        # Current artifact post-hoc: Last45 3.191 -> 2.991; cloud/solar midday
        # 4.783 -> 4.778; peak window 4.792 -> 4.791.
        - name: june_recent_85_93_clear_afternoon_backoff
          adjustment_mwh: -3.0
          allow_without_forecast_day: true
          months: [6]
          hours: [13, 14, 15, 16, 17]
          min_maxtemp_f: 85.0
          max_maxtemp_f: 93.0
          max_cloud_cover_norm: 0.20
        - name: june_recent_100_105_hot_evening_lift

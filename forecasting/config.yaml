    hour_loss: 0.03
    hour_cloud: 0.02

  peak_risk:
    enabled: true
    # Uses Prophet/CatBoost only as conditional warning signals, not as normal blends.
    hours: [16, 17, 18, 19, 20, 21]
    min_maxtemp_f: 78.0
    prophet_gap_threshold_mwh: 6.0

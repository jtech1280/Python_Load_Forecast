        "4": 1.25
        "5": 2.0
        "6": 2.5
        "7": 3.0
    ultra_extreme_heat_wave_uplift:
      # Disabled while operational_residual_learner is the single production
      # hot-peak correction path.
      # Full replay isolated the remaining actual-peak miss to rare 115F-plus heat-wave
      # days. Keep this separate from the normal 90F-plus hot-peak uplift because
      # 100-110F bucket-7 peak rows include large overforecasts.
      #
      # V12.9: the prior config was a hard step at exactly 115F. Roseville reaches 115F
      # on ~2 days per 6 years, but the recurring extreme tail (110-114F: ~23 days/6yr)
      # sat just below the trigger with zero uplift, and production-weather replay shows
      # a severe underforecast there. min_maxtemp_f is now the RAMP ONSET (110F) and
      # ramp_full_maxtemp_f (115F) is where the full hour_uplift_mwh magnitude applies,
      # so behavior at >=115F is unchanged while 110-115F gets graded (cliff removed).
      # NOTE: the seasonal-balanced replay origins top out at ~106F forecasted max, so
      # this band is not yet directly scored -- pin a hot origin (see training.rolling_origin_replay.fixed_origins)
      # to validate before raising the magnitudes.
      enabled: false
      min_forecast_day: 2
      max_forecast_day: 7
      min_maxtemp_f: 110.0          # ramp onset (uplift begins here)
      ramp_full_maxtemp_f: 115.0    # full hour_uplift_mwh magnitude at/above this temp
      max_uplift_mwh: 18.0
      hour_uplift_mwh:
        "10": 18.0
        "11": 18.0
        "12": 18.0
        "13": 18.0
        "14": 18.0
        "15": 18.0
        "16": 18.0
        "17": 10.0

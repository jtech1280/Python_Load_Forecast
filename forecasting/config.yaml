  weather_robustness_hedge:
    # Disabled while operational_residual_learner is the single production
    # hot-peak correction path. Weather scenarios still feed bands/audits.
    # V12.9 production weather-robustness hardening. Converts the existing +/-3F
    # weather-scenario re-predictions from a band-only signal into a small, bounded,
    # lead-aware UPLIFT on the hot/peak point forecast. Addresses the realized-vs-
    # forecast-weather gap: under operational (forecast) weather the hot-peak forecast
    # underforecasts by ~7-8 MWh on average (Jensen convexity of load in temperature),
    # which the realized-weather-tuned correction stack does not compensate for.
    #
    # 2026-06-08 replay showed the prior aggressive hedge reduced underforecast
    # risk but overshot warm-biased forecast-weather leads. Keep a small convexity
    # guard and damp it when previous-run weather is historically warm-biased at
    # that lead.
    enabled: false
    # Keep the primary realized-weather replay from scoring an operational
    # forecast-weather hedge. Previous-run weather replay still applies it.
    apply_to_realized_replay: false
    hours: [16, 17, 18, 19, 20]
    # Lower-capped ramp path for the June 12-style long-horizon hot ramp. This
    # lets scenario curvature add a small uplift before peak hours without
    # loosening the existing peak hedge.
    ramp_hours: [8, 9, 10, 11, 12, 13, 14, 15]
    ramp_min_maxtemp_f: 100.0
    ramp_min_forecast_day: 8
    ramp_max_forecast_day: 16
    ramp_cap_mwh: 3.5
    ramp_max_fraction_of_warmer_delta: 0.25
    # Gate on the FORECASTED daily-max (operationally available), not the realized max.
    min_maxtemp_f: 90.0
    exclude_holidays: true
    min_forecast_day: 1
    max_forecast_day: 16
    scenario_delta_f: 3.0           # must match the warmer/cooler scenario delta in bands.weather_scenarios
    # Operational-only hedge: previous-run forecast-weather rows still show large
    # hot-peak misses, so allow a modestly stronger bounded convexity/upper blend.
    jensen_scale: 1.50              # scales the symmetric convexity (Jensen) term
    upper_scenario_blend: 0.20      # small one-sided lean on the warmer scenario
    cap_mwh: 8.0
    max_fraction_of_warmer_delta: 0.70
    mae_to_sigma_factor: 1.2533     # half-normal MAE -> Gaussian sigma
    sigma_ref_lead: 7               # normalize the upper term to the longest validated lead
    min_signed_bias_damping: 0.35   # lower bound when lead weather is warm-biased
    # Daily-max temperature forecast error (MAE, F) by lead, from
    # rolling_origin_replay_weather_input_error_by_lead.csv. Re-tune from the live scorecard.
    # Leads 1-7 are measured; 8-16 are EXTRAPOLATED (gentle saturating growth toward the
    # seasonal daily-max spread) and are NOT validated against forecast weather -- they only
    # widen the hedge where weather is least trustworthy and remain bounded by cap_mwh.
    dailymax_temp_mae_by_lead_f:
      1: 1.94
      2: 1.00
      3: 1.92
      4: 2.36
      5: 4.11
      6: 4.69
      7: 6.30
      8: 6.80
      9: 7.20
      10: 7.55
      11: 7.85
      12: 8.10
      13: 8.35
      14: 8.55
      15: 8.75
      16: 8.90
    # Signed previous-run daily-max temperature bias by lead:
    # previous-run forecast minus realized weather. Positive means forecast weather
    # was already warm, so the hot uplift is damped rather than stacked on top.
    dailymax_temp_bias_by_lead_f:
      1: -0.59
      2: 1.25
      3: 1.85
      4: 2.98
      5: 3.94
      6: 4.11
      7: 3.97
      8: 4.00
      9: 4.00
      10: 4.00
      11: 4.00
      12: 4.00
      13: 4.00
      14: 4.00
      15: 4.00
      16: 4.00

  hot_ramp_peak_capture:
    # Guarded peak-anchor stage for clear, extreme heat-ramp events.
    # Promoted after replay showed the support/anchor guards flipped the sparse
    # hot-ramp stratum from net harmful to net beneficial.
    enabled: true
    shadow_mode: false
    model_version: "hot_ramp_peak_capture_guarded_prod_v2"
    source: "hot_ramp_peak_guarded_prod"
    # Keep sparse-event support for the walk-forward artifact; promotion safety

# --- Project configuration ---

project:
  name: "V12.9 Weather-Realism Peak-Risk Hardening"
  timezone: "America/Los_Angeles"
  output_dir: "${FORECAST_OUTPUT_DIR:-forecast_outputs}"

paths:
  # Optional machine-specific data root. Set FORECAST_DATA_ROOT in .env/.env.local
  # or in the server environment; config.local.yaml can also override any path.
  data_root: "${FORECAST_DATA_ROOT}"

sql:
  dsn_name: "Informatica LRS"
  # Historical hourly system load (MWh), day-wide rows with Hr1...Hr24 columns
  history_query: |
    SELECT *
    FROM [Informatica].[dbo].[METRIX_HRLY_SYSTEM_VW]
    ORDER BY YEAR, MONTH, DAY

actuals_import:
  # Freeze model-training actuals during daily tuning. The utility hourly convention
  # keeps the prior local day through the 23:00 completed-hour label and blocks
  # same-day actual changes from moving the model.
  limit_to_prior_day_he24: true
  cutoff_days_back: 1
  cutoff_hour_ending: 24

output_sql:
  # Default persistence for high-churn outputs that are overwritten on each CSV run.
  # Use --no-save-sql for local dry runs that should not write to SQL Server.
  enabled: true
  dashboard_read_enabled: true
  dsn_name: "Forecast_DB"
  database: ""
  schema: "Forecasting"
  run_table: "LoadForecastRun"
  forecast_table: "LoadForecastOutput"
  backtest_table: "LoadForecastBacktest"
  weather_table: "LoadForecastWeather"
  forecast_weather_archive_table: "LoadForecastWeatherArchive"
  replay_tables:
    rolling_origin_replay_summary: "LoadForecastReplaySummary"
    rolling_origin_replay_results: "LoadForecastReplayResult"
    rolling_origin_replay_origin_coverage: "LoadForecastReplayOriginCoverage"
    rolling_origin_replay_scorecard: "LoadForecastReplayScorecard"
    rolling_origin_replay_weather_realism_scorecard: "LoadForecastReplayWeatherRealismScorecard"
    rolling_origin_replay_weather_input_error_by_lead: "LoadForecastReplayWeatherInputErrorByLead"
    rolling_origin_replay_weather_input_sensitivity_scorecard: "LoadForecastReplayWeatherInputSensitivityScorecard"
    rolling_origin_replay_weather_input_sensitivity_detail: "LoadForecastReplayWeatherInputSensitivityDetail"
    rolling_origin_replay_stage_metrics: "LoadForecastReplayStageMetric"
    rolling_origin_replay_origin_metrics_by_stage: "LoadForecastReplayOriginMetricByStage"
    rolling_origin_replay_scored_season_metrics_by_stage: "LoadForecastReplayScoredSeasonMetricByStage"
    rolling_origin_replay_origin_season_metrics_by_stage: "LoadForecastReplayOriginSeasonMetricByStage"
    rolling_origin_replay_horizon_metrics_by_stage: "LoadForecastReplayHorizonMetricByStage"
    rolling_origin_replay_peak_window_metrics_by_stage: "LoadForecastReplayPeakWindowMetricByStage"
    rolling_origin_replay_peak_window_expansion_scorecard: "LoadForecastReplayPeakWindowExpansionScorecard"
    rolling_origin_replay_peak_window_14to20_metrics_by_stage: "LoadForecastReplayPeakWindow14to20MetricByStage"
    rolling_origin_replay_extreme_heat_peak_scorecard: "LoadForecastReplayExtremeHeatPeakScorecard"
    rolling_origin_replay_extreme_heat_peak_metrics_by_stage: "LoadForecastReplayExtremeHeatPeakMetricByStage"
    rolling_origin_replay_hot_peak_metrics_by_stage: "LoadForecastReplayHotPeakMetricByStage"
    rolling_origin_replay_hot_peak_candidate_metrics_by_stage: "LoadForecastReplayHotPeakCandidateMetricByStage"
    rolling_origin_replay_hot_peak_candidate_scorecard: "LoadForecastReplayHotPeakCandidateScorecard"
    rolling_origin_replay_hot_ramp_peak_metrics_by_stage: "LoadForecastReplayHotRampPeakMetricByStage"
    rolling_origin_replay_hot_ramp_peak_candidate_scorecard: "LoadForecastReplayHotRampPeakCandidateScorecard"
    rolling_origin_replay_heat_persistence_peak_metrics_by_stage: "LoadForecastReplayHeatPersistencePeakMetricByStage"
    rolling_origin_replay_heat_persistence_peak_candidate_scorecard: "LoadForecastReplayHeatPersistencePeakCandidateScorecard"
    rolling_origin_replay_shoulder_heat_metrics_by_stage: "LoadForecastReplayShoulderHeatMetricByStage"
    rolling_origin_replay_cloud_solar_midday_metrics_by_stage: "LoadForecastReplayCloudSolarMiddayMetricByStage"
    rolling_origin_replay_weekend_metrics_by_stage: "LoadForecastReplayWeekendMetricByStage"
    rolling_origin_replay_holiday_metrics_by_stage: "LoadForecastReplayHolidayMetricByStage"
    rolling_origin_replay_long_horizon_metrics_by_stage: "LoadForecastReplayLongHorizonMetricByStage"
    rolling_origin_replay_delta_breeze_shape_metrics_by_stage: "LoadForecastReplayDeltaBreezeShapeMetricByStage"
    rolling_origin_replay_daily_peak_shadow_window_scorecard: "LoadForecastReplayDailyPeakShadowWindowScorecard"
    rolling_origin_replay_daily_peak_miss_by_stage: "LoadForecastReplayDailyPeakMissByStage"
    rolling_origin_replay_daily_peak_he18_20_miss_by_stage: "LoadForecastReplayDailyPeakHE18to20MissByStage"
    rolling_origin_replay_heat_analog_shadow_metrics: "LoadForecastReplayHeatAnalogShadowMetric"
    rolling_origin_replay_heat_analog_shadow_detail: "LoadForecastReplayHeatAnalogShadowDetail"
    rolling_origin_replay_focused_guard_rule_audit: "LoadForecastReplayFocusedGuardRuleAudit"
    rolling_origin_replay_timing: "LoadForecastReplayTiming"
    production_readiness_scorecard: "LoadForecastProductionReadinessScorecard"
  chunksize: 10

five_min_load:
  enabled: true
  dsn_name: "PowerSupply"
  query: |
    SELECT
      StartPST,
      EndPST,
      TimeFrameName,
      Interval,
      Quantity,
      QualityName
    FROM PowerSupply.Measurements.Load_Native
    WHERE SourceTypeName = 'PI_AF'
      AND LocationName = 'RsvlCityGate'
      AND TimeFrameName = '5min'
      AND MeasurementTypeName = 'SystemLoad'
      AND StartPST >= DATEADD(day, -180, GETDATE())
    ORDER BY StartPST
  # Prior-hour 5-minute aggregates are leakage-safe for hourly forecasts.
  # Future hours carry the latest known intraday state with an age feature.
  max_carry_forward_hours: 24
  # Completed 5-minute hours are promoted into actual load history below. Future
  # 5-minute model feature carry-forward is disabled by default because fixed-origin
  # replay showed Day 1 degradation and exact future 5-minute values are not
  # operationally available.
  future_model_features_enabled: false
  # Promote completed 5-minute hours into the recent hourly load history so reruns
  # anchor the recursive forecast on the newest available system load.
  use_as_recent_hourly_load: true
  # Production runs should anchor on completed same-day 5-minute load even when
  # official hourly imports are frozen to the prior day for tuning/replay stability.
  respect_actuals_import_cutoff: false
  min_completed_intervals_per_hour: 10
  replace_overlap_hours: 0

local_weather:
  # Local station history is initially used for diagnostics. Enable temperature_calibration
  # explicitly for controlled A/B replay before promoting it to production.
  enabled: true
  dsn_name: "PowerSupply"
  query: |
    SELECT  'BERRY_ST' AS STATIONID,
            'Temperature' AS CONCEPTID,
            [PacificStandardTime] AS DT,
            [Value] AS READING
      FROM [PowerSupply].[Measurements].[Weather_Hourly]
      WHERE LocationName = 'Berry Sub'
      AND PacificStandardTime >= '2005-05-14'
    ORDER BY PacificStandardTime
  temperature_calibration:
    enabled: false
    blend: 1.0
    cap_f: 8.0
    max_abs_delta_f: 25.0
    min_count: 24
    # Real-time dynamic calibration to correct for transient cooling/warming events
    # like the Roseville Delta Breeze. Looks at the last 24 hours of actual weather station
    # readings vs Open-Meteo and applies a decaying correction factor to the future forecast.
    dynamic_enabled: true
    dynamic_window_hours: 24
    dynamic_cap_f: 6.0
    dynamic_blend: 0.80
    dynamic_decay_hours: 48.0

openmeteo:
  latitude: 38.7521
  longitude: -121.2880
  # Use UTC from API and convert to local timezone
  hourly_vars:
    - temperature_2m
    - relative_humidity_2m
    - cloud_cover
    - wind_speed_10m
    - wind_direction_10m
    - precipitation
    - shortwave_radiation
    - is_day
  temperature_unit: "fahrenheit"
  wind_speed_unit: "mph"
  precipitation_unit: "inch"
  # Request timestamps in the project timezone so "historical_end=yesterday local" includes
  # the entire local day (00:00-23:00), rather than stopping at 16:00 local when using GMT.
  timezone: "America/Los_Angeles"
  # When the forecast API is queried after midnight GMT, the returned hourly series can begin at
  # 00:00 "today" GMT (which is 17:00 the prior day in America/Los_Angeles), leaving a visible gap
  # between the last historical load hour and the first forecast hour. Request a small amount of
  # "past" hourly data so the next local midnight is always included; the pipeline still filters
  # to DT > latest_hist_dt, so this does not change the forecast horizon.
  forecast_past_hours: 36
  historical_url: "https://archive-api.open-meteo.com/v1/archive"
  forecast_url: "https://api.open-meteo.com/v1/forecast"
  previous_runs_url: "https://previous-runs-api.open-meteo.com/v1/forecast"
  historical_start: "2020-01-01"     # training start date
  historical_end: null                # null => yesterday local
  forecast_days: 16
  cache_dir: "${FORECAST_WEATHER_CACHE_DIR:-weather_cache}"
  forecast_import_policy:
    # Open-Meteo refreshes the 16-day forecast several times per day. For daily
    # model tuning, accept one morning forecast snapshot and reuse it for the rest
    # of the local day so repeated runs compare against stable weather inputs.
    enabled: true
    target_local_time: "06:30"
    import_window_start_local: "06:00"
    import_window_end_local: "07:45"
    daily_cache_stem: "forecast_weather_gfs_06z"
  # Pull a specific GFS Seamless run cycle (default 06Z) via Open-Meteo's Single Runs
  # API instead of the standard forecast_url's best_match blend. This keeps weather
  # inputs stable no matter what time the forecast is run: the first run of a local
  # day fetches the configured 06Z single run, later runs reuse that daily cache. If
  # today's 06Z run is not available yet, the loader can fall back to yesterday's 06Z
  # single run, but it will not fall back to Open-Meteo best_match unless explicitly
  # re-enabled below.
  gfs_run_lock:
    enabled: true
    single_runs_url: "https://single-runs-api.open-meteo.com/v1/forecast"
    model: "gfs_seamless"
    run_hour_utc: 6
    latest_cache_stem: "forecast_weather_gfs_06z_latest"
    allow_import_outside_window: true
    allow_previous_day_fallback: true
    allow_standard_forecast_fallback: false
    allow_forecast_results_fallback: false
  # PENDING VALIDATION (added 2026-08-11): guards against a single-run Open-Meteo point-
  # forecast temperature "flyer" getting frozen into the whole day's forecast by
  # forecast_import_policy above. Diagnosed from a real incident: 8/19/2026's forecasted
  # max had been trending 102/96/92F, then one 6:20am pull showed 79F, and a same-morning
  # re-pull recovered to 86F -- a run-to-run model artifact, not a real shift. When
  # enabled, cross-checks each hour's point-forecast temperature against Open-Meteo's
  # Ensemble API member spread; if the point value deviates from the ensemble mean by
  # more than min_deviation_f (and enough members are present to trust it), the ensemble
  # mean is used instead and the hour is flagged via TempF_Outlier_Corrected. Costs one
  # extra API call per import; any failure fetching the ensemble is non-fatal and falls
  # back to the point forecast unmodified. Disabled by default -- opt in per machine.
  ensemble_outlier_guard:
    enabled: false
    ensemble_url: "https://ensemble-api.open-meteo.com/v1/ensemble"
    # GFS's ensemble (GEFS, ~31 members) covers the full 16-day forecast horizon this
    # project uses. Verify against Open-Meteo's current ensemble-supported model list
    # before relying on this in production; an unsupported/renamed model id just fails
    # the (non-fatal) ensemble fetch rather than breaking the main forecast import.
    model: "gfs_seamless"
    min_deviation_f: 10.0
    min_members: 5
  # TLS certificate verification for weather API calls. Keep true so responses are
  # authenticated. On Windows, ssl_use_os_truststore lets requests honor the machine
  # certificate store via truststore, which fixes managed/self-signed proxy chains
  # without disabling verification. For a custom corporate PEM bundle, set
  # ssl_ca_bundle or OPENMETEO_CA_BUNDLE. OPENMETEO_SSL_VERIFY=false remains an
  # emergency local-only bypass and should not be committed into normal config.
  ssl_verify: true
  ssl_use_os_truststore: true
  ssl_ca_bundle: null

btm:
  mode: "hardcoded"   # "hardcoded" | "sql" | "csv"
  tsv_path: ""        # not used when mode=hardcoded
  sql_table: "[Informatica].[dbo].[BTM_SOLAR_MONTHLY_INSTALLATIONS]"
  extend_future_months: 36
  current_nameplate_mw: 63.5
  max_observed_impact_mw: 23.0

solar:
  # Machine-specific parquet roots are discovered in this order. Prefer setting
  # FORECAST_SOLAR_PARQUET_ROOT or FORECAST_DATA_ROOT on each server; the drive
  # candidates preserve today's C:/PY_LRS and D:/PY_LRS layouts without code edits.
  parquet_root: "${FORECAST_SOLAR_PARQUET_ROOT}"
  parquet_root_candidates:
    - "${FORECAST_DATA_ROOT}"
    - "D:/PY_LRS"
    - "C:/PY_LRS"
  weather_cache_dir: "${FORECAST_SOLAR_WEATHER_CACHE_DIR:-weather_cache/solar_weather}"
  driver: "${FORECAST_SOLAR_DRIVER:-ODBC Driver 17 for SQL Server}"
  dest_server: "${FORECAST_SOLAR_DEST_SERVER:-re-lrs-db-1}"
  dest_db: "${FORECAST_SOLAR_DEST_DB:-Forecast}"
  production_source: "${FORECAST_SOLAR_PRODUCTION_SOURCE:-rec-parquet}"

training:
  train_start_date: "2020-01-01"
  backtest_days: 45
  seasonal_backtests: false
  rolling_origin_replay:
    # Opt-in production-horizon replay. Use --rolling-origin-replay with --save-csv to export outputs.
    # Correction lookups/profile for each origin are learned from the preceding calibration window only.
    enabled: false
    parallel:
      enabled: true
      processes: 4  # null to default to cpu_count() // 2
      # CatBoost's GPU backend can terminate the native worker process on small GPUs
      # when multiple replay origins train concurrently. Keep origin replay serial
      # whenever CatBoost GPU is active; set false only on a larger dedicated GPU.
      serial_when_catboost_gpu: true
    horizon_days: 16
    calibration_days: 45
    origin_selection: "fixed" # Fixed set keeps tuning passes apples-to-apples; remove fixed_origins to rebalance.
    origin_step_days: 28
    max_origins: 27
    fixed_origins:
      - "2024-10-13"
      - "2024-11-09 23:00:00-08:00"
      - "2025-03-30"
      - "2025-04-27"
      - "2025-05-25"
      - "2025-06-22"
      - "2025-07-20"
      - "2025-08-17"
      - "2025-09-14"
      - "2025-10-12"
      - "2025-11-08 23:00:00-08:00"
      - "2025-12-06 23:00:00-08:00"
      - "2026-01-03 23:00:00-08:00"
      - "2026-01-31 23:00:00-08:00"
      - "2026-02-28 23:00:00-08:00"
      - "2026-03-29"
      - "2026-04-26"
      - "2026-05-24"
      # June 12-style hot-ramp validation: origins that score the 2026-06-12
      # 99F load ramp inside the production horizon once recent actuals exist.
      - "2026-05-28"
      - "2026-05-29"
      # July 21 hot clear peak miss coverage. July 6/7 score the event as long-lead
      # rows once July actuals exist; July 20/21 score day-ahead/intraday behavior
      # once the full 16-day replay horizon has actuals.
      - "2026-07-06"
      - "2026-07-07"
      - "2026-07-20"
      - "2026-07-21"
      # Aug 1-3 heat-ramp/persistence peak validation inside forecast days 1-7.
      - "2026-07-27"
      - "2026-07-28"
      - "2026-07-29"
    origins_per_season: 4
    scorecard_min_origins_per_season: 3
    min_train_days: 365
    # Speed controls for rolling replay only. Prophet is benchmark-only in production,
    # and the peak-risk guard now has tree-disagreement fallback signals, so replay
    # does not need to fit origin Prophet for the production correction chain.
    skip_prophet: true
    skip_calibration_prophet: true
    skip_catboost: false
    log_timing: true
    allow_concurrent: false
    weather_realism:
      # Previous Runs fixed-lead weather covers operational weather error for Days 1-7.
      enabled: true
      max_previous_days: 7

hardware:
  # V12.8 keeps V12.3/V12.4 max performance mode. Use all visible CPU cores and XGBoost GPU when available.
  # CPU threads: -1 means all visible logical cores. Override with --cpu-threads N.
  performance_mode: "max"
  cpu_threads: -1
  max_workers: -1
  set_thread_env: true
  overwrite_thread_env: false
  parallel_tree_training: true
  force_parallel_cpu_training: false

  # XGBoost GPU training is enabled by default. If CUDA/XGBoost rejects GPU training,
  # the script automatically retries CPU.
  use_gpu: true
  xgb_gpu_api: "auto"       # "auto" | "cuda" | "gpu_hist" | "legacy"
  fallback_to_cpu: true

  # LightGBM GPU is opt-in because many Windows wheels are CPU-only or OpenCL-dependent.
  # Leave false unless your installed LightGBM build is known to support GPU.
  use_lgb_gpu: false

model:
  ensemble_weights:
    # 2026-06-12 holdout grid, constrained to avoid worsening actual-peak
    # underforecast versus the prior XGB/LGB blend.
    xgb: 0.10
    lgb: 0.55
    prophet: 0.00     # benchmark-only unless blend_into_production=true
    catboost: 0.35

  early_stopping:
    # Improves generalization by stopping when recent validation MAE stops improving.
    enabled: true
    validation_days: 45
    min_train_rows: 2000
    rounds: 75
    metric: "mae"

  monotonic_constraints:
    # Forces a non-decreasing relationship between heat/cooling-demand features (Temperature,
    # CDD, HeatIndex, Extreme_Heat_* flags, hot-peak interaction terms, etc.) and load across
    # XGBoost, LightGBM, and CatBoost. This is standard practice for AC-driven summer-peaking
    # load: it keeps tree splits from fitting non-monotonic noise in the sparsely populated
    # extreme-heat bins, which is exactly where the hot-peak underforecast has historically
    # shown up, and it keeps predictions well-behaved when a forecast temperature exceeds the
    # hottest day seen in training. See forecasting/model/monotonic_constraints.py for the
    # default feature list; override with increasing_features/decreasing_features here if needed.
    enabled: true

  xgb:
    n_estimators: 1400
    max_depth: 8
    learning_rate: 0.025
    min_child_weight: 3
    subsample: 0.85
    colsample_bytree: 0.85
    reg_lambda: 2.0
    reg_alpha: 0.05
    gamma: 0.0
    tree_method: "hist"     # V12.2 GPU default: modern XGBoost uses hist + device=cuda
    device: "cuda"          # "cuda" or "cpu"; CPU fallback is controlled by hardware.fallback_to_cpu
    gpu_api: "auto"         # try modern CUDA first, then legacy gpu_hist, then CPU
    random_state: 42
    n_jobs: -1

  sample_weight:
    peak_q90: 0.90
    peak_q95: 0.95
    peak_q90_weight: 1.8
    peak_q95_weight: 3.0
    hot_day_min_f: 90.0
    hot_peak_hours: [16, 17, 18, 19, 20]
    hot_peak_weight: 1.9
    # Align train weighting with the production scorecard gates. The previous hot
    # emphasis only used IsLikelySystemPeakHour, which excludes weekends/holidays;
    # the scorecard hot gate is HE16-20 whenever daily max is >= 90F.
    non_business_hot_peak_weight: 1.35
    peak_window_hours: [14, 15, 16, 17, 18]
    peak_window_min_maxtemp_f: 75.0
    peak_window_weight: 1.18
    recency_end_weight: 1.35
    max_weight: 9.0

  lgb:
    # Keep CPU by default. Set hardware.use_lgb_gpu=true only if your LightGBM build supports GPU.
    use_gpu: false
    device_type: "gpu"
    n_estimators: 1200
    learning_rate: 0.025
    num_leaves: 96
    min_child_samples: 25
    subsample: 0.85
    colsample_bytree: 0.85
    reg_lambda: 2.0
    reg_alpha: 0.05
    random_state: 42
    n_jobs: -1

  catboost:
    # V12.9: CatBoost is blended into production at a constrained weight after
    # the latest holdout grid showed lower raw MAE without increasing the actual
    # peak miss versus the prior XGB/LGB blend.
    enabled: true
    blend_into_production: true
    iterations: 1400
    depth: 8
    learning_rate: 0.025
    l2_leaf_reg: 4.0
    loss_function: "RMSE"
    random_seed: 42
    # GPU first when hardware.use_gpu=true. In this production config CatBoost GPU is
    # required, so CPU fallback is disabled for CatBoost even though hardware.fallback_to_cpu
    # stays available for XGBoost/LightGBM. To force CPU on a smaller machine, set both
    # FORECAST_CATBOOST_REQUIRE_GPU=false and FORECAST_CATBOOST_TASK_TYPE=CPU in the OS
    # environment, then open a new terminal.
    require_gpu: "${FORECAST_CATBOOST_REQUIRE_GPU:-true}"
    task_type: "${FORECAST_CATBOOST_TASK_TYPE:-GPU}"
    devices: "0"
    # CatBoost GPU does not implement MAE as a native eval metric; scorecards still
    # evaluate MAE after prediction, but GPU early stopping uses RMSE to avoid the
    # "MAE is not implemented for GPU" warning and CPU-side metric throttling.
    gpu_eval_metric: "RMSE"
    thread_count: -1
    # CatBoost's own default (0.95) grabs nearly all free VRAM on startup. Keep a cap
    # because this workstation has a 5 GB GPU and XGBoost/display contexts may already
    # be resident. Rolling replay serializes CatBoost GPU training separately via
    # training.rolling_origin_replay.parallel.serial_when_catboost_gpu.
    gpu_ram_part: 0.20

  prophet:
    enabled: true
    blend_into_production: false   # Keep Prophet separate from production forecast by default.
    growth: "linear"
    seasonality_mode: "multiplicative"
    yearly_seasonality: true
    weekly_seasonality: true
    daily_seasonality: true
    changepoint_prior_scale: 0.08
    seasonality_prior_scale: 6.0
    holidays_prior_scale: 5.0
    interval_width: 0.80
    add_roseville_holidays: true
    holiday_years_forward: 3
    add_monthly_seasonality: true
    monthly_period_days: 30.5
    monthly_fourier_order: 5
    add_annual_peak_seasonality: true
    annual_peak_period_days: 365.25
    annual_peak_fourier_order: 12
    standardize_regressors: true
    regressor_prior_scale: 0.25
    min_train_rows: 1440
    # CmdStan can hang or run for many minutes when optimizing the full multi-year
    # hourly frame with the full regressor set. Keep Prophet as a recent-history
    # benchmark model; production Raw_Forecast_MWH does not blend Prophet by default.
    max_train_rows: 13140   # 18 months of hourly rows
    fit_algorithm: "LBFGS"
    fit_iter: 10000

forecast:
  horizons:
    next_day_hours: 24
    next_week_days: 7
    full_days: 16     # run through 16 calendar days
  require_full_window: false

quality:
  valid_temp_min_f: 10.0
  valid_temp_max_f: 120.0
  max_interpolation_gap_hours: 3
  # Timestamp alignment knob (ported from v11.6 WEATHER_TIMESTAMP_SHIFT_HOURS).
  # Use +1 or -1 only if your weather timestamps are proven to be offset relative to
  # the load timestamps (hour-beginning vs hour-ending conventions).
  weather_timestamp_shift_hours: 0

bands:
  # V12.8: conditional residual bands are primary, with extra widening for hours 14-16 and solar-loss risk.
  # Exported forecast outputs name the central 80% residual band P10/P50/P90.
  default_percent_band: 0.055
  band_floor_mwh: 4.0
  band_scale: 0.55
  residual_based: true
  hot_bucket_band_floor:
    # The 6-origin hot replay showed overnight interval undercoverage after the point forecast
    # guard fixes. Keep this scoped to hot overnight rows so midday/peak intervals are unchanged.
    enabled: true
    rules:
      - name: hot_95_to_100_overnight_min_band
        min_daily_max_temp_f: 95.0
        max_daily_max_temp_f: 100.0
        hour_groups: ["Overnight"]
        min_band_mwh: 5.5
      - name: hot_100_plus_overnight_min_band
        min_daily_max_temp_f: 100.0
        hour_groups: ["Overnight"]
        min_band_mwh: 7.5
      - name: hot_100_plus_early_overnight_min_band
        min_daily_max_temp_f: 100.0
        hours: [0, 1]
        min_band_mwh: 13.0
      - name: hot_100_plus_late_evening_min_band
        min_daily_max_temp_f: 100.0
        hour_groups: ["LateEvening"]
        min_band_mwh: 15.0
  weather_input_risk:
    # Previous-run weather replay showed forecast-weather inputs can roughly double operational
    # error on days 1-7, especially cloudy solar-loss and hot-peak regimes. This widens future
    # P10/P90 bands only; it does not move the P50 point forecast.
    enabled: true
    max_day: 16
    # Calibrated from rolling_origin_replay_weather_input_sensitivity_scorecard.
    # Day 1 and days 4-7 showed larger operational weather-error damage than days 2-3.
    day1_multiplier: 1.45
    days2to3_multiplier: 1.60
    days4to7_multiplier: 3.00
    days8to16_multiplier: 3.50
    cloudy_solar_multiplier: 1.45
    hot_peak_multiplier: 1.60
    shoulder_heat_multiplier: 1.45
    high_temp_min_maxtemp_f: 95.0
    high_temp_multiplier: 2.20
    cap_multiplier: 6.00
  weather_scenarios:
    enabled: true
    cap_scenario_deltas: true
    delta_caps:
      default_mwh: 18.0
      cloud_solar_mwh: 14.0
      hot_peak_mwh: 22.0
      days8to16_mwh: 16.0
      hot_peak_min_maxtemp_f: 90.0
      cloud_solar_min_loss_mw: 1.25
    scenarios:
      - name: warmer
        temperature_delta_f: 3.0
      - name: hot_stress_5f
        temperature_delta_f: 5.0
      - name: cooler
        temperature_delta_f: -3.0
      - name: cloudier_solar_loss
        cloud_cover_delta_norm: 0.30
        ghi_multiplier: 0.65
      - name: severe_cloud_solar_loss
        cloud_cover_delta_norm: 0.45
        ghi_multiplier: 0.50
      - name: clearer_high_solar
        cloud_cover_delta_norm: -0.30
        ghi_multiplier: 1.15
  conformal_weather:
    enabled: true
    quantile: 0.80
    safety_multiplier: 1.0
    scenario_spread_multiplier: 1.0
    # The guarded replay had high Day 1 / normal-hour coverage after conformal widening.
    # Reduce only those lower-risk conformal add-ons; hot peak, peak-window, cloud/solar,
    # shoulder heat, and long-horizon caution hours keep the full safety factor.
    horizon_safety_multipliers:
      Day1: 0.85
    normal_only_safety_multiplier: 0.92
    # Walk-forward replay showed conformal narrowing under-covered hot peaks and shoulder heat.
    # Use conformal and weather scenarios as additional guards, not as a replacement for the
    # tuned weather-risk band.
    allow_narrowing: false
    min_group_rows: 20
    min_global_rows: 50
    min_fraction_of_multiplier_band: 0.0

# Pure exclusion of anomalous load intervals (DER dispatch, telemetry gaps, etc.).
# The listed date + hour-ending (HE) ranges are DROPPED - not repaired - from residual
# learning, the calibration lookups, the recent-residual profile, and the replay
# scorecards, so they cannot bias corrections or register as spurious peak misses.
# HE h maps to rows with local DT.hour == h, matching the official completed-hour
# load label. Omit he_start/he_end to exclude a whole day.
anomaly_exclusions:
  enabled: true
  events:
    - name: "2026-07-15 DER dispatch"
      # EnergyHub DER event telemetry:
      # - dispatch shed: 17:00-18:45 local, avg 3.76 MW, max 4.90 MW, 7.52 MWh shifted
      # - post-event rebound: material through 20:45 local
      # Drop affected hourly actuals only: HE18-HE19 shed + HE20-HE21 rebound.
      date: "2026-07-15"
      he_start: 18
      he_end: 21

calibration:
  seasonal_enabled: true
  # PENDING REPLAY VALIDATION (added 2026-08-09): opt-in extra backtest length used only
  # to train hot_ramp_peak_capture/heat_persistence_peak_capture's walk-forward lookup
  # artifacts. Diagnosed via the 20260809_205652 replay: build_hot_ramp_peak_capture_artifact
  # requires a rare joint condition (hot AND ramping the same day) and was finding zero
  # qualifying days for most origins within the normal calibration window, so it returned
  # None and the stage silently fell back to targeted_missing_slices rules for the whole
  # origin -- which is why that rule list keeps growing instead of the lookup generalizing.
  # null skips the extra backtest pass entirely (zero cost, zero behavior change).
  #
  # 2026-08-11: split into two independent knobs after weighing cost-per-use across the
  # three callers. The extra backtest is expensive (one recursive XGB+LGB pass over the
  # full lookback window, ~16x the recursive-forecast length of the 45-day
  # calibration_days window at 730 days), and how well that cost amortizes differs a lot:
  #   - calibration_search.py (--build-cache) pays it once per origin, then reuses that
  #     cached data across potentially hundreds of cheap Optuna trials -- cheap per use.
  #   - The live forecast pays the full cost every single day to correct one day's
  #     forecast, and a replay pays it once per origin with no reuse -- expensive per use.
  # rare_event_artifact_lookback_days (this key) feeds the live forecast and replay paths
  # and defaults back to null (off) given that ratio; rare_event_artifact_lookback_days_search
  # below is calibration_search.py's own, independent value.
  rare_event_artifact_lookback_days: null
  # Dedicated to calibration_search.py (forecasting.tuning.calibration_search /
  # scripts/tune_calibration_optuna.py's --build-cache step) -- see the note above for why
  # this carries its own value instead of sharing rare_event_artifact_lookback_days.
  rare_event_artifact_lookback_days_search: 730
  stage_selector:
    # Full seasonal replay showed raw Day 1 and final peak-window selection leaving accuracy
    # on the table. Select the most robust stage by operational horizon and peak window.
    enabled: true
    day1_stage: targeted_meta
    days2to3_stage: recent_corrected
    days4to7_stage: recent_corrected
    non_horizon_apply_bias_uplift: false
    non_horizon_apply_hot_uplift: false
    suppress_bias_uplift_for_stage_overrides: true
    suppress_hot_uplift_for_stage_overrides: true
    day1_peak_risk_weight: 0.40
    hot_peak_min_maxtemp_f: 90.0
    hot_peak_final_stack_override: false
    peak_window_stage_override:
      # 2026-06-07 post-holiday replay: the broad HE14-18 override no longer cleared the
      # peak-window gate and slightly worsened the simpler horizon policy. Leave the
      # block available for A/B tests, but keep the production selector horizon-driven.
      enabled: false
      hours: [14, 15, 16, 17, 18]
      min_forecast_day: 1
      max_forecast_day: 16
      min_maxtemp_f: -999.0
      stage: recent_corrected
      exclude_hot_peak: true
      suppress_bias_uplift: true
      suppress_hot_uplift: true
    cloud_solar_stage_override:
      # Latest replay showed Day-1 cloud/solar midday rows were worse when the
      # generic Day-1 targeted-meta stage replaced the peak-risk stage. Keep the
      # normal Day-1 policy elsewhere, but use peak-risk for this narrow BTM
      # solar/cloud slice.
      enabled: true
      hours: [10, 11, 12, 13, 14, 15, 16]
      min_forecast_day: 1
      max_forecast_day: 1
      min_cloud_cover_norm: 0.60
      min_solar_loss_mw: 1.25
      stage: peak_risk
      suppress_bias_uplift: true
      suppress_hot_uplift: true
    cloud_solar_raw_override:
      # 2026-06-07 post-holiday replay showed recent-corrected beating the raw override
      # on cloud/solar midday (about 4.91 vs 5.60 MAE). Disable the broad raw override
      # unless a future replay proves the cloud slice regressed.
      enabled: false
      hours: [10, 11, 12, 13]
      min_cloud_cover_norm: 0.60
      min_solar_loss_mw: 1.25
      stage: raw
      suppress_bias_uplift: true
      suppress_hot_uplift: true
    conditional_stage_overrides:
      # Disabled while operational_residual_learner is the single production
      # hot-peak correction path. Keep the rule as an A/B-test candidate only.
      - name: day1_summer_hot_peak_peak_risk_override
        enabled: false
        seasons: [Summer]
        hours: [16, 17, 18, 19, 20]
        min_maxtemp_f: 103.0
        min_forecast_day: 1
        max_forecast_day: 1
        stage: peak_risk
        only_if_stage_above_current: true
      # Latest forecast-output scorecard showed summer high-temperature rows were
      # often better before the post-raw correction stack. Keep this narrow and
      # diagnostic so it can be A/B tested in rolling replay.
      - name: summer_high_temp_raw_override
        enabled: true
        seasons: [Summer]
        # Full replay: raw helped core midday but hurt HE16-20 and overnight.
        # Keep it outside the HE14-18 peak-window scorecard.
        hours: [9, 10, 11, 12, 13]
        min_daily_max_temp_bucket: 6
        min_forecast_day: 1
        max_forecast_day: 16
        stage: raw
    long_horizon_peak_hot_month_correction:
      # Production-active for bounded day-8..16 peak-window/month bias. A single
      # scalar hot uplift is not valid: May/Sep were overforecast while July was
      # underforecast. Use signed, bounded month corrections only on long-horizon
      # peak/hot rows. Hot rows override the peak offset on HE16-18 overlap so the
      # two tuned offsets do not stack.
      enabled: true
      min_forecast_day: 8
      max_forecast_day: 16
      peak_hours: [14, 15, 16, 17, 18]
      hot_hours: [16, 17, 18, 19, 20]
      hot_min_maxtemp_f: 90.0
      # The May hot-month downshift is calibrated for the 93F-plus long-horizon
      # overforecast cluster. Do not apply it to 90-92F shoulder-heat peaks,
      # where the weather-robustness hedge can otherwise fight a -12 MWh cap.
      hot_min_maxtemp_f_by_month:
        "5": 93.0
      peak_cap_mwh: 8.0
      hot_cap_mwh: 12.0
      peak_exclude_holidays: true
      hot_exclude_holidays: true
      peak_month_offsets_mwh:
        "1": 0.0
        "2": 0.80
        "3": 0.0
        "4": -1.54
        "5": 0.0
        "6": -2.12
        "7": 7.76
        "8": -1.39
        "9": -6.44
        "10": 2.21
        "11": 5.75
        "12": -1.16
      peak_month_forecast_day_scales:
        # Audit 20260722_213503: September's -6.44 MWh peak offset is helpful
        # overall, but it overcorrected forecast days 8, 9, 10, and 13.
        # Disable only those day/month cells while preserving the helpful
        # September long-horizon rows on days 11, 12, and 14-16.
        "9":
          "8": 0.0
          "9": 0.0
          "10": 0.0
          "13": 0.0
      hot_month_offsets_mwh:
        "5": -14.76
        "6": 0.0
        "7": 9.07
        "8": 0.11
        "9": 0.0
    focused_shape_residual_learner:
      # Guarded production promotion for the recent-window shape gap. The learner
      # still learns residual shape against the pre-focused-guard baseline, but
      # applies additively to the current guarded forecast with bounded peak/hot
      # deltas so it does not replace the hand guard or create a blanket hot uplift.
      enabled: true
      shadow_mode: false
      model_version: focused_shape_residual_guarded_promotion_v2
      min_rows: 168
      target_clip_mwh: 35.0
      blend: 0.495
      cap_mwh: 12.0
      apply_correction_to_reference_forecast: true
      promotion_delta_guard:
        enabled: true
        reference_col: current_final
        max_abs_delta_vs_reference_mwh: 8.0
        risk_slice_max_abs_delta_vs_reference_mwh: 5.0
        include_peak_window: true
        peak_window_hours: [14, 15, 16, 17, 18]
        include_hot_peak: true
        hot_peak_hours: [16, 17, 18, 19, 20]
        hot_peak_min_maxtemp_f: 90.0
      min_abs_correction_mwh: 0.25
      learning_rate: 0.04
      max_iter: 120
      max_leaf_nodes: 16
      min_samples_leaf: 16
      l2_regularization: 5.0
      random_state: 42
      scope:
        use_focused_guard_rule_union: false
        include_disabled_rules: false
        use_runtime_rule_context: true
        require_scope_for_application: true
        include_hot_peak: true
        hot_peak_min_maxtemp_f: 90.0
        hot_peak_hours: [14, 15, 16, 17, 18, 19, 20, 21]
        include_cloud_solar: true
        cloud_solar_hours: [10, 11, 12, 13, 14, 15, 16]
        cloud_solar_min_cloud_cover_norm: 0.60
        cloud_solar_min_solar_loss_mw: 1.25
        include_delta_breeze: true
        delta_breeze_hours: [16, 17, 18, 19, 20, 21, 22]
        delta_breeze_min_maxtemp_f: 95.0
        delta_breeze_max_cloud_cover_norm: 0.35
        delta_breeze_min_forecast_drop_next3hr_f: 6.0
        include_long_horizon_heat: true
        long_horizon_min_forecast_day: 8
        long_horizon_max_forecast_day: 16
        long_horizon_min_maxtemp_f: 75.0
        long_horizon_min_hour: 10
        long_horizon_max_hour: 22
    daily_peak_shadow_model:
      # Shadow-only daily peak layer. This models the remaining daily peak
      # magnitude/timing error after the current production correction stack and
      # writes Daily_Peak_Shadow_Adjusted_Forecast_MWH for replay promotion
      # decisions. It does not change Final_Forecast_MWH while shadow_mode=true.
      enabled: true
      shadow_mode: true
      model_version: daily_peak_shadow_v1
      min_days: 30
      # Latest rolling-origin replay showed daily peak magnitude improvement is
      # concentrated in the middle near-term horizon. Keep the layer shadow-only
      # and evaluate a narrower application window: forecast days 2-5 only.
      min_application_forecast_day: 2
      max_application_forecast_day: 5
      min_peak_window_rows_per_day: 4
      peak_hours: [14, 15, 16, 17, 18, 19, 20, 21]
      # adjustment_hours now matches peak_hours so the Gaussian correction center
      # is no longer clamped into a narrower [16,20] window. Previously a base peak
      # at HE14/HE15/HE21 had its magnitude correction shoved onto the wrong hour;
      # aligning the two windows keeps train/apply/score on one peak definition.
      adjustment_hours: [14, 15, 16, 17, 18, 19, 20, 21]
      # Leakage-safe evaluation: refit on earlier-only origins and score held-out
      # later days in daily_peak_shadow_summary. This out-of-sample delta is the
      # honest promote/hold signal; the in-sample delta is optimistic.
      out_of_sample_eval_enabled: true
      holdout_eval_step_days: 7
      target_clip_mwh: 35.0
      blend: 0.45
      cap_mwh: 10.0
      min_abs_correction_mwh: 0.50
      spread_hours: 0.65
      timing_model_enabled: true
      timing_blend: 0.50
      target_timing_clip_hours: 4.0
      max_timing_shift_hours: 3.0
      learning_rate: 0.04
      max_iter: 120
      max_leaf_nodes: 16
      min_samples_leaf: 8
      timing_min_samples_leaf: 8
      l2_regularization: 5.0
      random_state: 42
    focused_scorecard_guard:
      # Re-enabled after 2026-08-06 replay: the current stack improved seasonal
      # replay, hot peak, peak window, cloud/solar, and shoulder heat when these
      # bounded rules were applied after stage selection.
      # 2026-06-14 full rolling-origin counterfactual: retune the overactive June
      # clear-hot, May hot downshift, July holiday, and August day-4..7 rules, then
      # add narrow long-lead hot/peak guards for repeated same-shape misses.
      # Full replay counterfactual: hot 6.39 -> 5.78, peak 5.58 -> 5.39,
      # overall 3.94 -> 3.89.
      enabled: true
      total_cap_mwh: 30.0
      rule_health:
        # Diagnostic-only labels in the focused guard audit. A production rule is
        # considered healthy only when both its isolated and current-stack MAE
        # deltas are non-positive on replay-scored rows. Stack-gated rules are
        # judged on their current-stack delta because their standalone effect is
        # intentionally conditional on prior guards.
        enabled: true
        min_scored_rows: 1
        max_rule_only_delta_mae_mwh: 0.0
        max_current_stack_delta_mae_mwh: 0.0
      rules:
        # 2026-07-07 Last-45 counterfactual: these no-horizon shape guards use
        # only production-visible weather/hour fields. They are allowed on recent
        # actual backtest rows without re-enabling derived fake forecast horizons.
        # Current artifact post-hoc: Last45 3.191 -> 2.991; cloud/solar midday
        # 4.783 -> 4.778; peak window 4.792 -> 4.791.
        - name: june_recent_85_93_clear_afternoon_backoff
          adjustment_mwh: -3.0
          allow_without_forecast_day: true
          months: [6]
          hours: [13, 14, 15, 16, 17]
          min_maxtemp_f: 85.0
          max_maxtemp_f: 93.0
          max_cloud_cover_norm: 0.20
        - name: june_recent_100_105_hot_evening_lift
          # Audit 20260722_151616: +8 MWh fixed the largest underforecast cases
          # but overcorrected most 100-105F evening rows. A 3 MWh lift was the
          # best conservative replay counterfactual across the active rows.
          adjustment_mwh: 3.0
          allow_without_forecast_day: true
          months: [6]
          hours: [16, 17, 18, 19, 20]
          min_maxtemp_f: 100.0
          max_maxtemp_f: 105.0
        - name: june_recent_98_100_low_loss_midday_backoff
          # Audit 20260721_211955: the broad standalone version increased MAE,
          # while the high-state/cloudy overlap was strongly helpful. Keep only
          # the observable high-state/cloudy midday case and drop late peak hours.
          adjustment_mwh: -8.0
          allow_without_forecast_day: true
          months: [6]
          hours: [12, 13, 14, 15]
          min_maxtemp_f: 98.0
          max_maxtemp_f: 100.0
          min_cloud_cover_norm: 0.25
          max_solar_loss_mw: 1.25
          min_raw_minus_samehour_7day_mean_mwh: 15.0
          holiday: false
        - name: july_recent_100_plus_clear_peak_ramp_up
          # Disabled by correction audit 20260721_211955: N=6, Delta MAE +5.12.
          enabled: false
          adjustment_mwh: 7.0
          allow_without_forecast_day: true
          months: [7]
          hours: [14, 15, 16]
          min_maxtemp_f: 100.0
          max_cloud_cover_norm: 0.25
        - name: july_recent_100_plus_clear_hot_evening_lift
          # Disabled by correction audit 20260721_211955: N=5, Delta MAE +5.41.
          enabled: false
          adjustment_mwh: 8.0
          allow_without_forecast_day: true
          months: [7]
          hours: [17, 18, 19, 20]
          min_maxtemp_f: 100.0
          max_cloud_cover_norm: 0.25
          holiday: false
        - name: july_recent_cloudy_98_100_high_state_hot_evening_backoff
          # 2026-07-21 counterfactual: July 13-style cloudy 98-100F hot/evening
          # rows overforecast when raw was far above recent same-hour state. Keep
          # this separate from the 100F-plus clear heat-wave lift above.
          adjustment_mwh: -14.0
          allow_without_forecast_day: true
          months: [7]
          hours: [16, 17, 18, 19, 20, 21]
          min_maxtemp_f: 98.0
          max_maxtemp_f: 100.0
          min_cloud_cover_norm: 0.60
          min_raw_minus_samehour_7day_mean_mwh: 15.0
          holiday: false
        - name: july_warm_partly_cloudy_overnight_lift
          # Latest 45-day backtest still ran low on warm July overnight hours
          # with partial cloud cover. Small lift; excludes clear/calm and fully
          # overcast nights where the signal was weaker.
          # Audit 20260722_213503: +4 MWh improved tail error but slightly hurt
          # MAE on active rows, so keep only a half-strength nudge.
          adjustment_mwh: 2.0
          allow_without_forecast_day: true
          months: [7]
          hours: [0, 1, 2, 3, 4]
          min_maxtemp_f: 90.0
          max_maxtemp_f: 100.0
          min_cloud_cover_norm: 0.25
          max_cloud_cover_norm: 0.85
          holiday: false
        - name: july_recent_95_100_clear_post_peak_decay_backoff
          # 2026-07-27 miss review: clear 95-100F July days can decay faster
          # after the peak than the staged forecast/risk uplift expects. A
          # small -3 MWh backoff improved the latest recent-45 counterfactual
          # on active rows while leaving rolling replay essentially neutral.
          adjustment_mwh: -3.0
          allow_without_forecast_day: true
          months: [7]
          hours: [18, 19, 20, 21, 22, 23]
          min_maxtemp_f: 95.0
          max_maxtemp_f: 100.0
          max_cloud_cover_norm: 0.20
          holiday: false
        - name: july_clear_warm_late_evening_lift
          # Warm July HE23-24 rows were low in both recent backtest and rolling
          # replay. Gate to lower-cloud rows to avoid the July 13 cloudy
          # overforecast tail.
          adjustment_mwh: 3.0
          allow_without_forecast_day: true
          months: [7]
          hours: [22, 23]
          min_maxtemp_f: 90.0
          max_maxtemp_f: 100.0
          max_cloud_cover_norm: 0.50
          holiday: false
        - name: june_98_100_mixed_high_state_morning_midday_backoff
          # Mixed-cloud 98-100F June morning/midday rows were overstacked after
          # the low-loss backoff. Require raw above same-hour state so the rule
          # does not create a 2025-06-07-style replay underforecast.
          adjustment_mwh: -8.0
          allow_without_forecast_day: true
          months: [6]
          hours: [10, 11, 12, 13, 14, 15]
          min_maxtemp_f: 98.0
          max_maxtemp_f: 100.0
          min_cloud_cover_norm: 0.25
          min_raw_minus_samehour_7day_mean_mwh: 15.0
          holiday: false
        # 2026-07-23 recent-45 audit: the failing recent gate was concentrated
        # in a few production-visible June/July weather-state shapes. Keep these
        # no-horizon guards narrow so the seasonal replay remains the primary
        # robustness check.
        - name: july_recent_103_106_clear_morning_backoff
          adjustment_mwh: -6.0
          allow_without_forecast_day: true
          months: [7]
          hours: [6, 7, 8, 9, 10]
          min_maxtemp_f: 103.0
          max_maxtemp_f: 106.0
          max_cloud_cover_norm: 0.25
          holiday: false
        - name: july_recent_103_106_hot_peak_lift
          # 2026-07-30 rolling replay: this still helps the no-horizon latest
          # backtest, but day-8+ rolling origins were already high. Keep it as a
          # near-term/diagnostic heat-wave lift, and avoid the HE17/20/21 decay

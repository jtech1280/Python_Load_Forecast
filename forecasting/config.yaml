    # The fixed-origin hot-summer replay still had large Days 2-7 misses during
    # extreme 110F-plus peak-window events, while ordinary bucket-7 rows were often
    # already close or high. Keep the normal cap unchanged and only loosen it for
    # rows where a benchmark model is already warning high in that narrow regime.
    extreme_hot_peak:
      enabled: true
      min_forecast_day: 2
      max_forecast_day: 7
      min_maxtemp_f: 110.0
      hours: [16, 17, 18]
      cap_mwh: 16.0
    min_recent_underforecast_correction_mwh: 0.0

  weather_robustness_hedge:
    # V12.9 production weather-robustness hardening. Converts the existing +/-3F
    # weather-scenario re-predictions from a band-only signal into a small, bounded,
    # lead-aware UPLIFT on the hot/peak point forecast. Addresses the realized-vs-
    # forecast-weather gap: under operational (forecast) weather the hot-peak forecast
    # underforecasts by ~7-8 MWh on average (Jensen convexity of load in temperature),
    # which the realized-weather-tuned correction stack does not compensate for.
    #
    # 2026-06-08 replay showed the prior aggressive hedge reduced underforecast
    # risk but overshot warm-biased forecast-weather leads. Keep a small convexity
    # guard and damp it when previous-run weather is historically warm-biased at
    # that lead.
    enabled: true
    # Keep the primary realized-weather replay from scoring an operational
    # forecast-weather hedge. Previous-run weather replay still applies it.
    apply_to_realized_replay: false
    hours: [16, 17, 18, 19, 20]
    # Lower-capped ramp path for the June 12-style long-horizon hot ramp. This
    # lets scenario curvature add a small uplift before peak hours without
    # loosening the existing peak hedge.
    ramp_hours: [8, 9, 10, 11, 12, 13, 14, 15]
    ramp_min_maxtemp_f: 100.0
    ramp_min_forecast_day: 8
    ramp_max_forecast_day: 16
    ramp_cap_mwh: 3.5
    ramp_max_fraction_of_warmer_delta: 0.25
    # Gate on the FORECASTED daily-max (operationally available), not the realized max.
    min_maxtemp_f: 90.0
    exclude_holidays: true
    min_forecast_day: 1
    max_forecast_day: 16
    scenario_delta_f: 3.0           # must match the warmer/cooler scenario delta in bands.weather_scenarios
    # Operational-only hedge: previous-run forecast-weather rows still show large
    # hot-peak misses, so allow a modestly stronger bounded convexity/upper blend.
    jensen_scale: 1.50              # scales the symmetric convexity (Jensen) term
    upper_scenario_blend: 0.20      # small one-sided lean on the warmer scenario
    cap_mwh: 8.0
    max_fraction_of_warmer_delta: 0.70
    mae_to_sigma_factor: 1.2533     # half-normal MAE -> Gaussian sigma
    sigma_ref_lead: 7               # normalize the upper term to the longest validated lead
    min_signed_bias_damping: 0.35   # lower bound when lead weather is warm-biased
    # Daily-max temperature forecast error (MAE, F) by lead, from
    # rolling_origin_replay_weather_input_error_by_lead.csv. Re-tune from the live scorecard.
    # Leads 1-7 are measured; 8-16 are EXTRAPOLATED (gentle saturating growth toward the
    # seasonal daily-max spread) and are NOT validated against forecast weather -- they only
    # widen the hedge where weather is least trustworthy and remain bounded by cap_mwh.
    dailymax_temp_mae_by_lead_f:
      1: 1.94
      2: 1.00
      3: 1.92
      4: 2.36
      5: 4.11
      6: 4.69
      7: 6.30
      8: 6.80
      9: 7.20
      10: 7.55
      11: 7.85
      12: 8.10
      13: 8.35
      14: 8.55
      15: 8.75
      16: 8.90
    # Signed previous-run daily-max temperature bias by lead:
    # previous-run forecast minus realized weather. Positive means forecast weather
    # was already warm, so the hot uplift is damped rather than stacked on top.
    dailymax_temp_bias_by_lead_f:
      1: -0.59
      2: 1.25
      3: 1.85
      4: 2.98
      5: 3.94
      6: 4.11
      7: 3.97
      8: 4.00
      9: 4.00
      10: 4.00
      11: 4.00
      12: 4.00
      13: 4.00
      14: 4.00
      15: 4.00
      16: 4.00

  recent_residual:
    enabled: true
    recent_hours: 48
    same_hour_days: 7
    # V12.4: allow the online correction to key off similar weather/solar conditions.
    min_weather_bucket_count: 6
    blend: 0.85
    cap_mwh: 9.0
    decay_hours: 96
    min_decay: 0.25
    # Forecast-origin replay showed the pre-origin online profile over-correcting first-day hours.
    day1_scale: 0.35
    horizon_regime_scales:
      # Full replay showed the online residual profile transfers less reliably past day 1,
      # especially on clear hot Summer days where the peak/cloud stack already handles shape.
      forecast_day_scales:
        days2to3: 0.45
        days4to7: 1.0
        days8plus: 1.0
      summer_clear_hot_days2to7:
        enabled: true
        min_maxtemp_f: 90.0
        max_cloud_cover_norm: 0.20
        scale: 0.0
    hot_peak:
      # Dampen the online residual carryover only for Summer 90F-plus peak hours.
      min_maxtemp_f: 90.0
      hours: [16, 17, 18, 19, 20]
      default_scale: 1.0
      season_scales:
        Summer: 0.90
    ar_residual:
      # Conservative AR(1) carryover: residual_t = actual_t - pre_recent_forecast_t.
      enabled: false
      lookback_hours: 168
      min_pairs: 24
      max_lag_gap_hours: 1.5
      phi_shrink_k: 72.0
      phi_cap: 0.40
      blend: 0.35
      same_hour_blend: 0.20
      same_hour_days: 7
      cap_mwh: 4.0
      decay_hours: 36.0
      min_decay: 0.0
      forecast_day_scales:
        day1: 1.0
        days2to3: 0.45
        days4to7: 0.15
        days8plus: 0.0
    origin_day_state:
      # Conservative block-state carryover for same-sign residual episodes.
      # Uses only pre-origin residuals and applies a heavily shrunk day-level state.
      enabled: false
      lookback_days: 7
      min_day_hours: 12
      min_days: 2
      min_total_hours: 36
      latest_day_weight: 0.65
      require_latest_recent_same_sign: true
      shrink_days: 6.0
      shrink_hours: 96.0
      state_cap_mwh: 5.0
      min_abs_state_mwh: 0.50
      blend: 0.45
      hourgroup_blend: 0.15
      same_hour_blend: 0.10
      require_component_same_sign: true
      same_sign_threshold_mwh: 0.25
      min_same_sign_run_hours: 4
      short_run_scale: 0.50
      cap_mwh: 2.0
      decay_days: 5.0
      min_decay: 0.0
      forecast_day_scales:
        day1: 0.35
        days2to3: 0.45
        days4to7: 0.25
        days8plus: 0.08
      cap_by_forecast_day:
        day1: 1.00
        days2to3: 1.50
        days4to7: 1.00
        days8plus: 0.50
    weights:
      recent_mean: 0.35
      last24_mean: 0.20
      same_hour: 0.16
      hourgroup: 0.06
      global: 0.03
      temp_hourgroup: 0.08
      cloud_hourgroup: 0.05
      solar_hourgroup: 0.03
      solar_loss_hourgroup: 0.08
      temp_cloud_hourgroup: 0.05


    # Earlier replays needed a small origin-agnostic uplift for the bias gate. The
    # post-holiday replay now passes bias without it, and this uplift contributes to
    # long-lead hot/peak overforecast clusters.
    underforecast_bias_uplift_mwh: 0.0
    hot_peak_uplift:
      # Normal 90F-plus hot uplift was protective in earlier fixed-origin runs, but the
      # 2026-06-07 post-holiday seasonal replay shows it overcorrecting long-lead
      # 90-97F peak hours. Keep the 110F-plus emergency layer below; disable this broad
      # normal-hot uplift until a lead-aware replacement is proven.
      enabled: false
      min_forecast_day: 2
      max_forecast_day: 16
      min_maxtemp_f: 90.0
      hours: [14, 15, 16, 17, 18, 19, 20]
      base_uplift_mwh: 0.0
      max_uplift_mwh: 3.0
      horizon_uplift_mwh:
        Days2to7: 2.25
        Days8to16: 2.25
      temp_bucket_uplift_mwh:
        "4": 1.25
        "5": 2.0
        "6": 2.5
        "7": 3.0
    ultra_extreme_heat_wave_uplift:
      # Full replay isolated the remaining actual-peak miss to rare 115F-plus heat-wave
      # days. Keep this separate from the normal 90F-plus hot-peak uplift because
      # 100-110F bucket-7 peak rows include large overforecasts.
      #
      # V12.9: the prior config was a hard step at exactly 115F. Roseville reaches 115F
      # on ~2 days per 6 years, but the recurring extreme tail (110-114F: ~23 days/6yr)
      # sat just below the trigger with zero uplift, and production-weather replay shows
      # a severe underforecast there. min_maxtemp_f is now the RAMP ONSET (110F) and
      # ramp_full_maxtemp_f (115F) is where the full hour_uplift_mwh magnitude applies,
      # so behavior at >=115F is unchanged while 110-115F gets graded (cliff removed).
      # NOTE: the seasonal-balanced replay origins top out at ~106F forecasted max, so
      # this band is not yet directly scored -- pin a hot origin (see training.rolling_origin_replay.fixed_origins)
      # to validate before raising the magnitudes.
      enabled: true
      min_forecast_day: 2
      max_forecast_day: 7
      min_maxtemp_f: 110.0          # ramp onset (uplift begins here)
      ramp_full_maxtemp_f: 115.0    # full hour_uplift_mwh magnitude at/above this temp
      max_uplift_mwh: 18.0
      hour_uplift_mwh:
        "10": 18.0
        "11": 18.0
        "12": 18.0
        "13": 18.0
        "14": 18.0
        "15": 18.0
        "16": 18.0
        "17": 10.0
  targeted_residual_meta:
    # Compact origin-available residual layer before the weighted lookup corrections.
    # The broad part is deliberately capped; the second part only acts on cloudy solar-loss midday hours.
    enabled: true
    min_rows: 336
    min_event_rows: 48
    global_blend: 0.35
    event_blend: 0.45
    global_cap_mwh: 6.0
    event_cap_mwh: 5.0
    total_cap_mwh: 8.0
    # The raw tree ensemble is already comparatively strong on very hot peak hours.
    # Do not let the broad residual learner double-correct that narrow regime.
    hot_peak_min_maxtemp_f: 90.0
    hot_peak_hours: [16, 17, 18, 19, 20]
    hot_peak_scale: 0.0
    min_samples_leaf: 24
    event_min_samples_leaf: 12
    learning_rate: 0.05
    max_iter: 80
    max_leaf_nodes: 8
    l2_regularization: 3.0
    solar_cloud_min_loss_mw: 1.25
    random_state: 42
  # Balanced seasonal replay showed this post-residual correction over-shooting hot-peak slices.
  # Keep the lookup code available, but gate it off until a future scorecard retune proves it helps.
  heat_peak_enabled: false
  blend: 0.85
  cap_mwh: 22.0
  shrink_k: 24.0
  level_weights:
    global: 0.05
    hour: 0.08
    season_hour: 0.12
    season_hourgroup_maxtemp: 0.18
    season_hour_maxtemp: 0.20
    season_month_hour_maxtemp: 0.18
    season_cloud_hourgroup: 0.09
    season_solar_hourgroup: 0.05
    temp_cloud_hourgroup: 0.05
  residual_calibration_hot_peak:
    # Summer 90F-plus peak residual lookup corrections overshot the seasonal replay,
    # but fully removing them underpredicted the actual system-peak row. Keep a smaller
    # bounded contribution.
    # Spring 90F-plus peak rows stayed low after the targeted meta guard and residual stack.
    # Score a bounded Spring uplift through the residual lookup instead of the raw ensemble.
    min_maxtemp_f: 90.0
    hours: [16, 17, 18, 19, 20]
    default_scale: 1.0
    season_scales:
      Spring: 2.0
      Summer: 0.65
  heat_peak_min_maxtemp_f: 88.0
  heat_peak_hours: [12, 13, 14, 15, 16, 17, 18, 19, 20]
  heat_peak_blend: 0.50
  heat_peak_cap_mwh: 12.0
  heat_peak_shrink_k: 18.0

  warm_ramp_enabled: true

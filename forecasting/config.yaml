  heat_persistence_peak_capture:
    # Guarded companion to hot_ramp_peak_capture for Aug-3-style heat
    # persistence peaks where daily max stays extreme but the 1-day ramp is
    # below the hot-ramp threshold. Promoted after the 2026-08-15 replay showed
    # only 16 touched rows, all Aug day-6/7 peak rows, improving touched-row MAE
    # from 9.92 to 6.43 MWh and seasonal MAE from 4.636 to 4.631.
    enabled: true
    shadow_mode: false
    model_version: "heat_persistence_peak_capture_guarded_prod_v1"
    source: "heat_persistence_peak_guarded_prod"
    min_training_days: 3
    min_lookup_days: 2
    train_enforce_forecast_day: false
    # PENDING REPLAY VALIDATION (added 2026-08-09): same starvation issue as
    # hot_ramp_peak_capture's train_min_* overrides above -- requiring min_maxtemp_f AND
    # 3+ consecutive extreme-hot days AND a high 3-day mean simultaneously for the lookup's
    # training frame is an even narrower joint condition, so this artifact is starved more
    # easily. These only widen the training pool; apply-time gating is unchanged.
    train_min_maxtemp_f: 95.0
    train_min_consecutive_extreme_days100: 1.0
    train_min_dailymax_3day_mean_f: 95.0
    min_maxtemp_f: 100.0
    min_consecutive_extreme_days100: 3.0
    min_dailymax_3day_mean_f: 100.0
    max_dailymax_ramp_1day_f: 2.0
    strong_min_maxtemp_f: 100.0
    strong_min_consecutive_extreme_days100: 3.0
    min_forecast_day: 1
    max_forecast_day: 7
    hours: [16, 17, 18, 19, 20]
    max_cloud_cover_norm: 0.40
    spread_hours: 1.0
    persistence_floor_mwh: 0.0
    strong_persistence_floor_mwh: 9.0
    cap_mwh: 9.0
    strong_cap_mwh: 9.0
    min_abs_correction_mwh: 0.25
    floor_applies_without_positive_anchor: true
    # Reverted to shadow-only on 2026-08-17: strong_min_maxtemp_f/strong_min_consecutive_
    # extreme_days100 equal the base scope thresholds, so every in-scope row is "strong",
    # and strong_persistence_floor_mwh == strong_cap_mwh (9.0) makes the anchorless
    # fallback a flat +9 MWh correction across the entire strong scope whenever the
    # per-origin lookup is starved -- not just the narrow Aug day-6/7 pattern it was
    # validated on. The 2026-08-16 4:44 PM full replay showed Hot peak days (+0.223 MAE)
    # and Peak window 14-18 (+0.079 MAE) both got worse after this went live in
    # production, so it stays shadow-only (diagnostics only) until validated against the
    # full hot-peak/peak-window gate population, not just the 16-row touched slice.
    allow_anchorless_fallback: false
    allow_anchorless_shadow_fallback: true
    recent_anchor_days: 3
    warmer_scenario_fraction: 0.25
    cooling_underway_guard:
      enabled: true
      mode: "all"
      min_hour: 18
      min_drop_from_dailymax_f: 5.0
      min_forecast_drop_next3hr_f: 6.0
      min_delta_breeze_cooling_signal: 1.0
      min_delta_breeze_post_peak_load_decay_signal: 1.0
      blocked_source: "heat_persistence_peak_cooling_underway_blocked"

  operational_residual_learner:
    # Scoped second-pass learner for residuals left after the production correction
    # chain. The full residual signal is promoted only through a small per-row cap
    # after replay showed it closes the Last-45 miss without broad hot uplift. The
    # uncapped signal stays in Auto_Residual_Full_Shadow_* diagnostics.
    enabled: true
    shadow_mode: false
    production_scope: "capped_full_shadow"
    capped_full_shadow_cap_mwh: 1.0
    model_version: "operational_residual_capped_full_shadow_v1"
    min_rows: 336
    backtest_min_train_rows: 336
    target_clip_mwh: 30.0
    learning_rate: 0.05
    max_iter: 80
    max_leaf_nodes: 12
    min_samples_leaf: 24
    l2_regularization: 4.0
    blend: 0.35
    cap_mwh: 6.0
    total_cap_mwh: 8.0
    hot_peak:
      enabled: true
      min_rows: 48
      min_samples_leaf: 12
      min_maxtemp_f: 90.0
      hours: [16, 17, 18, 19, 20]
      blend: 0.45
      cap_mwh: 6.0
      structural_shadow:
        # Shadow-only structural hot-peak candidate inside ORL. This tests
        # forecast-origin-safe hot/peak residual evidence without relying on the
        # raw-vs-yesterday gate that blocks many broader hot underforecasts.
        enabled: true
        source: "global+hot_peak_structural_residual"
        min_rows: 48
        min_samples_leaf: 12
        min_maxtemp_f: 90.0
        hours: [16, 17, 18, 19, 20]
        min_forecast_day: 1
        max_forecast_day: 16
        blend: 0.30
        cap_mwh: 5.0
        total_cap_mwh: 5.0
        min_positive_correction_mwh: 1.0
        allow_negative_correction: false
        respect_cooling_underway_guard: true
        below_min_source: "hot_peak_structural_below_min_correction"
        no_positive_source: "hot_peak_structural_no_positive_correction"
        cooling_underway_guard:
          enabled: true
          mode: "all"
          min_drop_from_dailymax_f: 5.0
          min_forecast_drop_next3hr_f: 6.0
          cap_positive_correction_mwh: 0.0
          blocked_source: "hot_peak_structural_cooling_underway_guard_blocked"
      broad_shadow:
        # Shadow-only ORL candidate for testing a broader hot-peak gate without
        # changing Final_Forecast_MWH. Promotion decisions should come from the
        # horizon x month x temp/cloud replay scorecards, not from loosening the
        # production positive_gate globally.
        enabled: true
        source: "global+hot_peak_broad_shadow"
        min_maxtemp_f: 90.0
        hours: [16, 17, 18, 19, 20]
        min_forecast_day: 1
        max_forecast_day: 16
        blend: 0.45
        cap_mwh: 6.0
        total_cap_mwh: 8.0
        min_abs_correction_mwh: 0.25
        allow_negative_correction: false
        no_positive_source: "hot_peak_broad_no_positive_correction"
        below_min_source: "hot_peak_broad_below_min_correction"
        positive_gate:
          enabled: true
          min_raw_minus_samehour_7day_mean_mwh: 8.0
          max_raw_minus_samehour_7day_mean_mwh: 45.0
          min_raw_minus_samehour_yesterday_mwh: 0.0
          max_final_minus_raw_forecast_mwh: 18.0
          max_cloud_cover_norm: 0.40
          allow_negative_correction: false
          blocked_source: "hot_peak_broad_low_forecast_gate_blocked"
        cooling_underway_guard:
          enabled: true
          mode: "all"
          min_drop_from_dailymax_f: 5.0
          min_forecast_drop_next3hr_f: 6.0
          cap_positive_correction_mwh: 0.0
          blocked_source: "hot_peak_broad_cooling_underway_guard_blocked"
      positive_gate:
        # Promoted toward the broad hot-peak shadow gate after replay showed it
        # was the best overall shadow stage and still positive on hot-peak slices.
        # Keep the same bounded raw-vs-recent state checks and cooling guard.
        enabled: true
        min_raw_minus_samehour_7day_mean_mwh: 8.0
        max_raw_minus_samehour_7day_mean_mwh: 45.0
        min_raw_minus_samehour_yesterday_mwh: 0.0
        max_final_minus_raw_forecast_mwh: 18.0
        min_forecast_day: 1
        max_forecast_day: 16
        max_cloud_cover_norm: 0.40
        allow_negative_correction: false
        live_ramp_gate:
          # Day-1 escape hatch for the positive hot-peak gate when completed
          # same-day load proves the ramp is running above recent analog levels.
          # This keeps the correction in operational_residual_learner instead of
          # reintroducing separate hot-ramp or peak-risk point movers.
          enabled: true
          source: "global+hot_peak_live_ramp_gate"
          min_forecast_day: 1
          max_forecast_day: 1
          hours: [17, 18, 19]
          min_maxtemp_f: 100.0
          max_cloud_cover_norm: 0.20
          min_lag1_mwh: 330.0
          min_lag1_minus_base_forecast_mwh: 0.0
          min_lag1_minus_samehour_yesterday_mwh: 10.0
          min_lag1_minus_samehour_7day_mean_mwh: 35.0
          min_live_ramp_1hr_mwh: 4.0
        blocked_source: "hot_peak_low_forecast_gate_blocked"
        cooling_underway_guard:
          # Replay diagnostics showed the correction chain can over-lift hot
          # evening rows once the load-shape has already rolled into post-peak
          # decay. Suppress positive auto-residual lifts only when both current
          # cooling from the daily max and the forecasted next-3-hour drop confirm
          # that decay is underway.
          enabled: true
          mode: "all"
          min_drop_from_dailymax_f: 5.0
          min_forecast_drop_next3hr_f: 6.0
          cap_positive_correction_mwh: 0.0
          blocked_source: "hot_peak_cooling_underway_guard_blocked"

  recent_residual:
    enabled: true
    recent_hours: 48
    same_hour_days: 7
    # V12.4: allow the online correction to key off similar weather/solar conditions.
    min_weather_bucket_count: 6
    blend: 0.85
    cap_mwh: 9.0
    decay_hours: 96
    min_decay: 0.25
    # Forecast-origin replay showed the pre-origin online profile over-correcting first-day hours.
    day1_scale: 0.35
    horizon_regime_scales:
      # Full replay showed the online residual profile transfers less reliably past day 1,
      # especially on clear hot Summer days where the peak/cloud stack already handles shape.
      forecast_day_scales:
        days2to3: 0.45
        days4to7: 1.0
        days8plus: 1.0
      summer_clear_hot_days2to7:
        enabled: true
        min_maxtemp_f: 90.0
        max_cloud_cover_norm: 0.20
        scale: 0.0
    hot_peak:
      # Disable online residual carryover on 90F-plus peak hours.
      min_maxtemp_f: 90.0
      hours: [16, 17, 18, 19, 20]
      # Disable hot-peak-specific online residual carryover; the general recent
      # residual profile can still operate outside hot-peak rows.
      default_scale: 0.0
      season_scales:
        Summer: 0.0
    ar_residual:
      # Conservative AR(1) carryover: residual_t = actual_t - pre_recent_forecast_t.
      enabled: false
      lookback_hours: 168
      min_pairs: 24

          max_cloud_cover_norm: 0.25
          max_raw_minus_samehour_yesterday_mwh: -3.0
          holiday: false
        - name: july_recent_90_93_post_heatwave_midday_lift
          adjustment_mwh: 8.0
          allow_without_forecast_day: true
          months: [7]
          hours: [10, 11, 12, 13, 14, 15, 16]
          min_maxtemp_f: 90.0
          max_maxtemp_f: 93.0
          max_cloud_cover_norm: 0.15
          max_raw_minus_samehour_yesterday_mwh: -20.0
